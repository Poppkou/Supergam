<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>Masked Merc FPS 3D — Warzone</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05050a;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }
    body { font-family: Arial, sans-serif; }
    #scene, #ui {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    #scene { z-index: 1; touch-action: none; }
    #ui { z-index: 2; pointer-events: none; }
    
    .touchOnly { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .touchOnly { display: block; }
    }
    
    #fullscreenBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      padding: 10px 14px;
      font-size: 16px;
      color: #fff;
      background: rgba(15, 15, 25, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      touch-action: manipulation;
      cursor: pointer;
    }
    #pauseBtn {
      position: fixed;
      top: 62px;
      right: 12px;
      z-index: 10;
      padding: 10px 14px;
      font-size: 16px;
      color: #fff;
      background: rgba(15, 15, 25, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      touch-action: manipulation;
      cursor: pointer;
      font-weight: bold;
      min-width: 44px;
    }
    #fireBtn {
      position: fixed;
      right: 26px;
      bottom: 80px;
      z-index: 10;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      background: rgba(220, 40, 40, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.4);
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #fireBtn:active { background: rgba(220, 40, 40, 0.85); }

    #jumpBtn {
      position: fixed;
      right: 26px;
      bottom: 190px;
      z-index: 10;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      background: rgba(50, 140, 220, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.4);
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #jumpBtn:active { background: rgba(50, 140, 220, 0.85); }
  </style>
</head>

<body>
  <button id="fullscreenBtn">⛶ Полный экран</button>
  <button id="pauseBtn">⏸</button>
  <button id="jumpBtn" class="touchOnly">ПРЫЖОК</button>
  <button id="fireBtn" class="touchOnly">ОГОНЬ</button>

  <canvas id="scene"></canvas>
  <canvas id="ui"></canvas>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const sceneCanvas = document.getElementById("scene");
    const uiCanvas = document.getElementById("ui");
    const ctx = uiCanvas.getContext("2d");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const fireBtn = document.getElementById("fireBtn");
    const jumpBtn = document.getElementById("jumpBtn");

    const renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, antialias: true });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    const FOG_COLOR = 0x6a4a3a;
    scene.background = new THREE.Color(0x1a1a2a);
    scene.fog = new THREE.Fog(FOG_COLOR, 40, 150);

    const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 600);

    const BASE_FOV = 75;
    const BASE_ASPECT = 16 / 9;

    let view = { dpr: 1, cssW: 1, cssH: 1 };

    function resize() {
      const vv = window.visualViewport;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssW = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
      const cssH = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
      view = { dpr, cssW, cssH };

      renderer.setPixelRatio(dpr);
      renderer.setSize(cssW, cssH, false);

      sceneCanvas.style.width = cssW + "px";
      sceneCanvas.style.height = cssH + "px";

      camera.aspect = cssW / cssH;

      const hFov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_FOV) / 2) * BASE_ASPECT);
      let fov = 2 * Math.atan(Math.tan(hFov / 2) / camera.aspect) * 180 / Math.PI;
      camera.fov = Math.min(100, Math.max(55, fov));
      camera.updateProjectionMatrix();

      uiCanvas.width = Math.floor(cssW * dpr);
      uiCanvas.height = Math.floor(cssH * dpr);
      uiCanvas.style.width = cssW + "px";
      uiCanvas.style.height = cssH + "px";
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 150));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resize);
      window.visualViewport.addEventListener("scroll", resize);
    }
    resize();

    const HALF_W = 48;
    const HALF_D = 27;
    const obstacles = [];

    // ============================================================
    //  ПРОЦЕДУРНЫЕ ТЕКСТУРЫ — ЗОНА БОЕВЫХ ДЕЙСТВИЙ
    // ============================================================
    function makeTexture(size, drawFn, repeatX = 1, repeatY = 1) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      drawFn(g, size);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.anisotropy = 4;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function drawField(g, s) {
      g.fillStyle = '#3a2a1c';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 1200; i++) {
        const x = Math.random() * s;
        const y = Math.random() * s;
        const r = 6 + Math.random() * 26;
        const green = 50 + Math.random() * 70;
        g.fillStyle = `rgba(${green * 0.55}, ${green}, ${green * 0.3}, ${0.25 + Math.random() * 0.4})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * s;
        const y = Math.random() * s;
        const r = 8 + Math.random() * 22;
        g.fillStyle = `rgba(85, 60, 35, ${0.3 + Math.random() * 0.5})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
      for (let i = 0; i < 60; i++) {
        const x = Math.random() * s;
        const y = Math.random() * s;
        const r = 6 + Math.random() * 18;
        g.fillStyle = `rgba(15, 10, 8, ${0.35 + Math.random() * 0.4})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
      for (let i = 0; i < 8; i++) {
        g.strokeStyle = `rgba(30, 20, 12, ${0.3 + Math.random() * 0.3})`;
        g.lineWidth = 4 + Math.random() * 6;
        g.beginPath();
        let x = Math.random() * s, y = Math.random() * s;
        g.moveTo(x, y);
        for (let j = 0; j < 5; j++) {
          x += (Math.random() - 0.5) * 100;
          y += (Math.random() - 0.5) * 100;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      for (let i = 0; i < 6000; i++) {
        const v = Math.random();
        const a = Math.random() * 0.16;
        g.fillStyle = v > 0.5 ? `rgba(180,160,120,${a})` : `rgba(0,0,0,${a})`;
        g.fillRect(Math.random() * s, Math.random() * s, 2, 2);
      }
    }

    function drawSandbag(g, s) {
      g.fillStyle = '#6a5a3a';
      g.fillRect(0, 0, s, s);
      const rows = 5;
      const rowH = s / rows;
      for (let r = 0; r < rows; r++) {
        const y = r * rowH;
        const offset = (r % 2) * (s / 10);
        for (let i = -1; i < 6; i++) {
          const x = i * (s / 5) + offset;
          const shade = 0.8 + Math.random() * 0.3;
          g.fillStyle = `rgb(${Math.floor(130 * shade)}, ${Math.floor(110 * shade)}, ${Math.floor(72 * shade)})`;
          g.beginPath();
          g.ellipse(x + s/10, y + rowH/2, s/10 - 2, rowH/2 - 3, 0, 0, Math.PI * 2);
          g.fill();
          g.strokeStyle = 'rgba(30, 20, 10, 0.7)';
          g.lineWidth = 1.4;
          g.stroke();
          g.fillStyle = `rgba(220, 200, 150, 0.12)`;
          g.beginPath();
          g.ellipse(x + s/10 - 2, y + rowH/2 - rowH/4, s/14, rowH/8, 0, 0, Math.PI * 2);
          g.fill();
        }
      }
      for (let i = 0; i < 2000; i++) {
        g.fillStyle = `rgba(0,0,0,${Math.random() * 0.2})`;
        g.fillRect(Math.random() * s, Math.random() * s, 2, 2);
      }
    }

    function drawMetalPanel(g, s) {
      g.fillStyle = '#181a22';
      g.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 3) {
        const alpha = Math.random() * 0.08;
        g.fillStyle = `rgba(200,210,240,${alpha})`;
        g.fillRect(0, y, s, 1);
      }
      for (let i = 0; i < 1200; i++) {
        g.fillStyle = `rgba(0,0,0,${Math.random() * 0.15})`;
        g.fillRect(Math.random() * s, Math.random() * s, 3, 3);
      }
      for (let i = 0; i < 40; i++) {
        const x = Math.random() * s;
        const y = Math.random() * s;
        const r = 4 + Math.random() * 15;
        g.fillStyle = `rgba(140, 70, 30, ${0.15 + Math.random() * 0.3})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
      g.strokeStyle = '#0a0b10';
      g.lineWidth = 8;
      g.strokeRect(4, 4, s - 8, s - 8);
      g.strokeStyle = 'rgba(120,140,200,0.25)';
      g.lineWidth = 1;
      g.strokeRect(9, 9, s - 18, s - 18);
    }

    function drawCrater(g, s) {
      g.clearRect(0, 0, s, s);
      const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
      grad.addColorStop(0.00, 'rgba(10, 6, 4, 0.98)');
      grad.addColorStop(0.35, 'rgba(25, 15, 10, 0.9)');
      grad.addColorStop(0.60, 'rgba(50, 32, 20, 0.7)');
      grad.addColorStop(0.80, 'rgba(70, 48, 28, 0.35)');
      grad.addColorStop(1.00, 'rgba(70, 48, 28, 0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 200; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = (0.35 + Math.random() * 0.6) * s / 2;
        const x = s/2 + Math.cos(ang) * rad;
        const y = s/2 + Math.sin(ang) * rad;
        const r = 1 + Math.random() * 3;
        g.fillStyle = `rgba(${40 + Math.random() * 30}, ${25 + Math.random() * 20}, ${15 + Math.random() * 10}, ${0.4 + Math.random() * 0.5})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
    }

    function drawSky(g, s) {
      const grad = g.createLinearGradient(0, 0, 0, s);
      grad.addColorStop(0.00, '#0a0a18');
      grad.addColorStop(0.30, '#241826');
      grad.addColorStop(0.50, '#4a2430');
      grad.addColorStop(0.66, '#8a3a26');
      grad.addColorStop(0.78, '#c26a34');
      grad.addColorStop(0.88, '#e0a05a');
      grad.addColorStop(1.00, '#f0c080');
      g.fillStyle = grad;
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 90; i++) {
        const x = Math.random() * s;
        const y = s * 0.15 + Math.random() * s * 0.55;
        const r = 25 + Math.random() * 90;
        const alpha = 0.04 + Math.random() * 0.16;
        const grey = 30 + Math.random() * 50;
        g.fillStyle = `rgba(${grey}, ${Math.floor(grey * 0.8)}, ${Math.floor(grey * 0.75)}, ${alpha})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
      for (let i = 0; i < 12; i++) {
        const x = Math.random() * s;
        const baseY = s * 0.82 + Math.random() * s * 0.1;
        const height = s * (0.2 + Math.random() * 0.35);
        const width = 6 + Math.random() * 18;
        const alpha = 0.25 + Math.random() * 0.35;
        const plume = g.createLinearGradient(x, baseY, x, baseY - height);
        plume.addColorStop(0, `rgba(30, 20, 18, ${alpha})`);
        plume.addColorStop(0.5, `rgba(50, 35, 30, ${alpha * 0.7})`);
        plume.addColorStop(1, `rgba(60, 45, 40, 0)`);
        g.fillStyle = plume;
        g.beginPath();
        g.moveTo(x - width * 0.4, baseY);
        g.quadraticCurveTo(x - width * 0.8, baseY - height * 0.5, x - width, baseY - height);
        g.lineTo(x + width, baseY - height);
        g.quadraticCurveTo(x + width * 0.8, baseY - height * 0.5, x + width * 0.4, baseY);
        g.closePath();
        g.fill();
      }
      for (let i = 0; i < 6; i++) {
        const x = Math.random() * s;
        const y = s * 0.86 + Math.random() * s * 0.05;
        const r = 20 + Math.random() * 60;
        const glow = g.createRadialGradient(x, y, 0, x, y, r);
        glow.addColorStop(0, 'rgba(255, 140, 60, 0.35)');
        glow.addColorStop(1, 'rgba(255, 140, 60, 0)');
        g.fillStyle = glow;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
    }

    function drawSmokeColumn(g, s) {
      g.clearRect(0, 0, s, s);
      const grad = g.createLinearGradient(0, 0, 0, s);
      grad.addColorStop(0, 'rgba(30,25,25,0)');
      grad.addColorStop(0.35, 'rgba(40,30,28,0.55)');
      grad.addColorStop(0.7, 'rgba(60,45,42,0.75)');
      grad.addColorStop(1, 'rgba(70,55,50,0.35)');
      g.fillStyle = grad;
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 40; i++) {
        const x = s * 0.5 + (Math.random() - 0.5) * s * 0.7;
        const y = Math.random() * s;
        const r = 20 + Math.random() * 40;
        const a = 0.05 + Math.random() * 0.1;
        g.fillStyle = `rgba(60, 50, 48, ${a})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
    }

    const fieldTex = makeTexture(512, drawField, 10, 6);
    const outerFieldTex = makeTexture(512, drawField, 20, 16);
    const sandbagTex = makeTexture(512, drawSandbag, 1, 1);
    const obstacleTex = makeTexture(256, drawMetalPanel, 1, 1);
    const craterTex = makeTexture(256, drawCrater, 1, 1);
    const skyTex = makeTexture(1024, drawSky, 1, 1);
    const smokeTex = makeTexture(256, drawSmokeColumn, 1, 1);

    // ============================================================
    //  НЕБО
    // ============================================================
    const skyGeo = new THREE.SphereGeometry(280, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
    const skyMat = new THREE.MeshBasicMaterial({
      map: skyTex,
      side: THREE.BackSide,
      fog: false,
      depthWrite: false
    });
    const skyDome = new THREE.Mesh(skyGeo, skyMat);
    skyDome.renderOrder = -1;
    scene.add(skyDome);

    const skyBottomGeo = new THREE.SphereGeometry(280, 32, 8, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5);
    const skyBottomMat = new THREE.MeshBasicMaterial({
      color: FOG_COLOR,
      side: THREE.BackSide,
      fog: false,
      depthWrite: false
    });
    const skyBottom = new THREE.Mesh(skyBottomGeo, skyBottomMat);
    skyBottom.renderOrder = -1;
    scene.add(skyBottom);

    // ============================================================
    //  ЗЕМЛЯ
    // ============================================================
    const outerFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 400),
      new THREE.MeshStandardMaterial({ map: outerFieldTex, color: 0x8a7a5a, roughness: 1 })
    );
    outerFloor.rotation.x = -Math.PI / 2;
    outerFloor.position.y = -0.08;
    outerFloor.receiveShadow = true;
    scene.add(outerFloor);

    const arenaFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(HALF_W * 2, HALF_D * 2),
      new THREE.MeshStandardMaterial({ map: fieldTex, roughness: 0.95 })
    );
    arenaFloor.rotation.x = -Math.PI / 2;
    arenaFloor.receiveShadow = true;
    scene.add(arenaFloor);

    // ============================================================
    //  ВОРОНКИ
    // ============================================================
    const craterMaterial = new THREE.MeshBasicMaterial({
      map: craterTex,
      transparent: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1
    });

    const craterRimMat = new THREE.MeshStandardMaterial({
      color: 0x4a3520,
      roughness: 1
    });

    const craterPositions = [
      [-40, -20, 3.5], [-38, 20, 4.2], [40, -20, 3.8], [38, 22, 4.0],
      [-20, 22, 3.2], [22, 22, 3.0], [-22, -22, 3.4], [24, -22, 3.6],
      [-10, 0, 3.5], [10, 0, 4.0], [-45, 0, 3.0], [45, 0, 3.2],
      [-8, -20, 2.8], [12, 20, 3.4], [0, -25, 3.0], [0, 25, 3.2]
    ];

    for (const [cx, cz, cr] of craterPositions) {
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(cr * 2, cr * 2),
        craterMaterial
      );
      plane.rotation.x = -Math.PI / 2;
      plane.position.set(cx, 0.015, cz);
      plane.renderOrder = 0;
      scene.add(plane);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(cr, 0.18, 4, 20),
        craterRimMat
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.set(cx, 0.06, cz);
      scene.add(rim);

      for (let i = 0; i < 5; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rr = cr + 0.6 + Math.random() * 0.8;
        const rockSize = 0.15 + Math.random() * 0.2;
        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(rockSize),
          new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 1, flatShading: true })
        );
        rock.position.set(
          cx + Math.cos(ang) * rr,
          rockSize * 0.5,
          cz + Math.sin(ang) * rr
        );
        rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
        scene.add(rock);
      }
    }

    // ============================================================
    //  ОКОПЫ / МЕШКИ С ПЕСКОМ
    // ============================================================
    function addSandbagWall(x, z, w, d, h) {
      const tex = sandbagTex.clone();
      tex.needsUpdate = true;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(Math.max(1, Math.round(Math.max(w, d) * 0.35)), Math.max(1, Math.round(h * 0.6)));
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 1 });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    addSandbagWall(0, -HALF_D - 0.5, HALF_W * 2 + 2, 1.2, 3.0);
    addSandbagWall(0, HALF_D + 0.5, HALF_W * 2 + 2, 1.2, 3.0);
    addSandbagWall(-HALF_W - 0.5, 0, 1.2, HALF_D * 2, 3.0);
    addSandbagWall(HALF_W + 0.5, 0, 1.2, HALF_D * 2, 3.0);

    function addTrenchSandbagRow(x, z, w, d, h, rotY = 0) {
      const seg = 2.4;
      const len = Math.max(w, d);
      const count = Math.max(1, Math.round(len / seg));
      for (let i = 0; i < count; i++) {
        const t = (i + 0.5) / count;
        const sx = (w > d) ? x - w / 2 + t * w : x;
        const sz = (d >= w) ? z - d / 2 + t * d : z;
        const bagW = (w > d) ? seg * 0.95 : 1.2;
        const bagD = (w > d) ? 1.2 : seg * 0.95;
        const bagH = h * (0.85 + Math.random() * 0.3);
        addSandbagWall(sx, sz, bagW, bagD, bagH);
      }
    }

    addTrenchSandbagRow(-32, -HALF_D + 4, 14, 1.2, 1.6);
    addTrenchSandbagRow(32, HALF_D - 4, 14, 1.2, 1.6);
    addTrenchSandbagRow(-HALF_W + 4, -18, 1.2, 10, 1.6);
    addTrenchSandbagRow(HALF_W - 4, 18, 1.2, 10, 1.6);

    // ============================================================
    //  ПРЕПЯТСТВИЯ
    // ============================================================
    const obstacleData = [
      { x: -28.7, z: -8.5, w: 4.6, d: 15, h: 4 },
      { x: 28.7, z: -8.5, w: 4.6, d: 15, h: 4 },
      { x: -28.7, z: 8.5, w: 4.6, d: 15, h: 4 },
      { x: 28.7, z: 8.5, w: 4.6, d: 15, h: 4 },
      { x: 0, z: -9.3, w: 14, d: 3.4, h: 3 },
      { x: 0, z: 9.3, w: 14, d: 3.4, h: 3 },
      { x: -36, z: 0, w: 10, d: 2.6, h: 2.5 },
      { x: 36, z: 0, w: 10, d: 2.6, h: 2.5 }
    ];

    function addObstacle(x, z, w, d, h) {
      const tex = obstacleTex.clone();
      tex.needsUpdate = true;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(Math.max(1, Math.round(w * 0.35)), Math.max(1, Math.round(h * 0.5)));

      if (!faceTexture || !enemy) return;

      const h = r * 1.7;
      const w = h * (faceAspect || 1);

    function updateFacePlaneTransform(enemy) {
      const plane = enemy.facePlane;
      if (!plane) return;

      const r = enemyRadii[enemy.type] || 1.3;
      const dx = camera.position.x - enemy.x;
      const dz = camera.position.z - enemy.z;
      const dh = Math.hypot(dx, dz) || 1;
      const ux = dx / dh, uz = dz / dh;

      plane.position.set(
        enemy.x + ux * (r + 0.06),
        enemy.y + 0.15,
        enemy.z + uz * (r + 0.06)
      );

      plane.lookAt(camera.position.x, plane.position.y, camera.position.z);

    const HIT_SOUND_PATH = './dvigj.mp3';   // ← имя твоего файла

    const hitSoundPool = [];
    let hitSoundIndex = 0;
    let audioUnlocked = false;

    for (let i = 0; i < HIT_SOUND_POOL_SIZE; i++) {
      const a = new Audio(HIT_SOUND_PATH);
      a.preload = 'auto';
      a.volume = HIT_SOUND_VOLUME;
      hitSoundPool.push(a);
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      for (const a of hitSoundPool) {
        try {
          a.volume = 0;
          const p = a.play();
          const reset = () => {
            a.pause();
            a.currentTime = 0;
            a.volume = HIT_SOUND_VOLUME;
          };
          if (p && p.then) p.then(reset).catch(reset);
          else reset();
        } catch (e) {}
      }
    }

    function playHitSound() {
      if (!audioUnlocked) return;
      const a = hitSoundPool[hitSoundIndex];
      hitSoundIndex = (hitSoundIndex + 1) % HIT_SOUND_POOL_SIZE;
      try {
        a.currentTime = 0;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}

    function circleRectCollideXZ(x, z, r, o) {
      const minX = o.x - o.w / 2, maxX = o.x + o.w / 2;
      const minZ = o.z - o.d / 2, maxZ = o.z + o.d / 2;
      const closestX = Math.max(minX, Math.min(x, maxX));
      const closestZ = Math.max(minZ, Math.min(z, maxZ));
      const dx = x - closestX, dz = z - closestZ;
      return dx * dx + dz * dz < r * r;
    }

    function hitsObstacleOrBounds(x, z, r) {
      if (x - r < -HALF_W || x + r > HALF_W || z - r < -HALF_D || z + r > HALF_D) return true;
      for (const o of obstacles) {
        if (circleRectCollideXZ(x, z, r, o)) return true;
      }
      return false;
    }

    function moveWithCollision(entity, dx, dz) {
      if (dx !== 0) {
        const nx = entity.x + dx;
        if (!hitsObstacleOrBounds(nx, entity.z, entity.r)) entity.x = nx;
      }
      if (dz !== 0) {
        const nz = entity.z + dz;
        if (!hitsObstacleOrBounds(entity.x, nz, entity.r)) entity.z = nz;
      }
    }

    function spawnEnemy() {

      else if (wave >= 2 && roll < 0.48) type = "shooter";

      let r = enemyRadii[type];

      let x = -HALF_W + 4, z = -HALF_D + 4;
      for (let i = 0; i < 60; i++) {
        const side = Math.floor(Math.random() * 4);
        if (side === 0) { x = -HALF_W + 4 + Math.random() * (HALF_W * 2 - 8); z = -HALF_D + 4; }

        const distToPlayer = Math.hypot(x - player.x, z - player.z);

      let hp, speed, damage, scoreValue, y;

    function fireWeapon() {
      const weapon = weapons[player.weapon];
      player.fireCooldown = weapon.fireDelay;

      const direction = new THREE.Vector3();
      camera.getWorldDirection(direction);

      const muzzlePos = new THREE.Vector3();
      gunBarrel.getWorldPosition(muzzlePos);

      for (let i = 0; i < weapon.pellets; i++) {
        const bulletDir = direction.clone();
        bulletDir.x += (Math.random() - 0.5) * weapon.spread;
        bulletDir.y += (Math.random() - 0.5) * weapon.spread;
        bulletDir.z += (Math.random() - 0.5) * weapon.spread;
        bulletDir.normalize();

        const mesh = new THREE.Mesh(tracerGeo, friendlyTracerMat);
        const spawnPos = muzzlePos.clone().add(bulletDir.clone().multiplyScalar(0.5));
        mesh.position.copy(spawnPos);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), bulletDir);
        scene.add(mesh);

        bullets.push({
          x: spawnPos.x, y: spawnPos.y, z: spawnPos.z,
          vx: bulletDir.x * weapon.speed, vy: bulletDir.y * weapon.speed, vz: bulletDir.z * weapon.speed,
          r: 0.4, damage: weapon.damage, friendly: true, life: 1.5, mesh, is3D: true
        });
      }

      weaponRecoil = 0.15;
      flashTime = 0.05;
      muzzleFlash.intensity = 2.5;
    }

    function stickVector(start, current, radius, dead) {
      const dx = current.x - start.x, dy = current.y - start.y;
      const mag = Math.hypot(dx, dy);
      if (mag < dead) return { x: 0, y: 0 };
      const power = Math.min(mag, radius) / radius;
      return { x: (dx / mag) * power, y: (dy / mag) * power };
    }

    function updateTouchVectors() {
      touch.moveVector = touch.moveId === null ? { x: 0, y: 0 } : stickVector(touch.moveStart, touch.moveCurrent, MOVE_RADIUS, MOVE_DEAD);
    }

    function clampPitch() {
      const maxPitch = Math.PI / 2 - 0.05;
      if (player.pitch > maxPitch) player.pitch = maxPitch;
      if (player.pitch < -maxPitch) player.pitch = -maxPitch;
    }

    const mouseLookAccum = { x: 0, y: 0 };

    function update(dt) {
      if (state !== "playing") return;

      if (player.jumping) {
        player.jumpVel -= JUMP_GRAVITY * dt;
        player.jumpOffset += player.jumpVel * dt;
        if (player.jumpOffset <= 0) {
          player.jumpOffset = 0;
          player.jumpVel = 0;
          player.jumping = false;
        }
      }

      if (mouseLookAccum.x !== 0 || mouseLookAccum.y !== 0) {
        player.yaw -= mouseLookAccum.x * LOOK_SENS_MOUSE;
        player.pitch -= mouseLookAccum.y * LOOK_SENS_MOUSE;
        clampPitch();
        mouseLookAccum.x = 0; mouseLookAccum.y = 0;
      }

      let inputFwd = 0, inputRight = 0;
      if (keys["w"] || keys["arrowup"]) inputFwd += 1;
      if (keys["s"] || keys["arrowdown"]) inputFwd -= 1;
      if (keys["d"] || keys["arrowright"]) inputRight += 1;
      if (keys["a"] || keys["arrowleft"]) inputRight -= 1;

      if (touch.moveId !== null) {
        inputFwd -= touch.moveVector.y;
        inputRight += touch.moveVector.x;
      }

      const inputLen = Math.hypot(inputFwd, inputRight);
      if (inputLen > 1) { inputFwd /= inputLen; inputRight /= inputLen; }

      if (inputLen > 0.01) {
        const fwd = getForwardXZ();
        const right = getRightXZ();
        const dx = (fwd.x * inputFwd + right.x * inputRight) * player.speed * dt;
        const dz = (fwd.z * inputFwd + right.z * inputRight) * player.speed * dt;
        moveWithCollision(player, dx, dz);
      }

      const firing = mouseDown || touch.fireBtnDown;
      player.fireCooldown -= dt;
      player.invuln -= dt;

      if (firing && player.fireCooldown <= 0) fireWeapon();

      if (spawnQueue > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnEnemy();
          spawnQueue--;
          spawnTimer = Math.max(0.16, 0.75 - wave * 0.04);
        }
      }

      for (const e of enemies) {
        const dx = player.x - e.x, dz = player.z - e.z;
        const dist = Math.hypot(dx, dz) || 1;
        const nx = dx / dist, nz = dz / dist;
        let mx = 0, mz = 0;

        if (e.type === "shooter") {
          e.fireCooldown -= dt;
          if (dist > 28) { mx = nx; mz = nz; }
          else if (dist < 18) { mx = -nx; mz = -nz; }
          else { mx = -nz * e.strafeDir; mz = nx * e.strafeDir; }

          if (e.fireCooldown <= 0 && dist < 48) {
            const targetY = EYE_HEIGHT, fromY = e.y;
            const tdx = player.x - e.x, tdy = targetY - fromY, tdz = player.z - e.z;
            const tlen = Math.hypot(tdx, tdy, tdz) || 1;
            const dir = new THREE.Vector3(tdx / tlen, tdy / tlen, tdz / tlen);
            dir.x += (Math.random() - 0.5) * 0.08;
            dir.y += (Math.random() - 0.5) * 0.08;
            dir.z += (Math.random() - 0.5) * 0.08;
            dir.normalize();

            const bx = e.x + nx * (e.r + 0.5), bz = e.z + nz * (e.r + 0.5);
            const mesh = new THREE.Mesh(tracerGeo, enemyTracerMat);
            mesh.position.set(bx, fromY, bz);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
            scene.add(mesh);

            bullets.push({
              x: bx, y: fromY, z: bz,
              vx: dir.x * 28, vy: dir.y * 28, vz: dir.z * 28,
              r: 0.4, damage: 8 + wave, friendly: false, life: 2.5, mesh, is3D: true
            });
            e.fireCooldown = Math.max(0.7, 1.35 - wave * 0.03);
          }
        } else {
          mx = nx; mz = nz;
        }

        moveWithCollision(e, mx * e.speed * dt, mz * e.speed * dt);
        e.mesh.position.set(e.x, e.y, e.z);
        e.mesh.rotation.y = Math.atan2(dx, dz);

        updateFacePlaneTransform(e);

        if (dist < e.r + player.r + 0.3 && player.invuln <= 0) {
          player.hp -= e.damage;
          player.invuln = 0.7;
          moveWithCollision(player, nx * 1.8, nz * 1.8);
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        if (b.is3D) b.y += b.vy * dt;
        b.z += b.vz * dt;
        b.life -= dt;

        if (b.life <= 0 || hitsObstacleOrBounds(b.x, b.z, b.r) || (b.is3D && (b.y < 0.1 || b.y > 20))) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
          continue;
        }

        let removed = false;
        if (b.friendly) {
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const dh = Math.hypot(b.x - e.x, b.z - e.z);
            const dy = Math.abs(b.y - e.y);
            if (dh < b.r + e.r && dy < e.y + 0.8) {
              e.hp -= b.damage;
              playHitSound();               // ← звук попадания во врага
              scene.remove(b.mesh);
              bullets.splice(i, 1);
              removed = true;
              if (e.hp <= 0) {
                score += e.score;
                scene.remove(e.mesh);
                if (e.facePlane) scene.remove(e.facePlane);
                dropPickup(e.x, e.z);
                enemies.splice(j, 1);
              }
              break;
            }
          }
        } else {
          const dh = Math.hypot(b.x - player.x, b.z - player.z);
          const dy = Math.abs(b.y - EYE_HEIGHT);
          if (dh < b.r + player.r + 0.3 && dy < 1.4 && player.invuln <= 0) {
            player.hp -= b.damage;
            player.invuln = 0.45;
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            removed = true;
          }
        }
        if (!removed) b.mesh.position.set(b.x, b.y, b.z);
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.ttl -= dt;
        if (p.ttl <= 0) { scene.remove(p.mesh); pickups.splice(i, 1); continue; }
        p.mesh.rotation.y += dt * 2;
        p.mesh.position.y = 1.2 + Math.sin(globalTime * 3 + p.phase) * 0.18;

        if (Math.hypot(p.x - player.x, p.z - player.z) < p.r + player.r) {
          if (p.type === "medkit") {
            player.hp = Math.min(player.maxHp, player.hp + 25);
          } else if (weaponIndexByType[p.type] !== undefined) {
            player.weapon = weaponIndexByType[p.type];
          }
          scene.remove(p.mesh);
          pickups.splice(i, 1);
        }
      }

      if (spawnQueue === 0 && enemies.length === 0) {
        betweenWaveTimer -= dt;
        if (betweenWaveTimer <= 0) {
          score += 25 * wave;
          player.hp = Math.min(player.maxHp, player.hp + 12);
          startWave(wave + 1);
        }
      }

      if (player.hp <= 0) {
        player.hp = 0;
        state = "gameover";
        if (document.exitPointerLock) { try { document.exitPointerLock(); } catch (e) {} }
      }
    }

    function updateCamera(dt) {
      weaponRecoil *= Math.pow(0.001, dt);
      if (flashTime > 0) {
        flashTime -= dt;
        if (flashTime <= 0) muzzleFlash.intensity = 0;
      }

      const moving =
        Math.abs(touch.moveVector.x) + Math.abs(touch.moveVector.y) > 0.1 ||
        keys["w"] || keys["a"] || keys["s"] || keys["d"] ||
        keys["arrowup"] || keys["arrowdown"] || keys["arrowleft"] || keys["arrowright"];

      if (moving) weaponBob += dt * 10;
      else weaponBob += dt * 2;

      const bobX = Math.sin(weaponBob * 2) * (moving ? 0.015 : 0.005);
      const bobY = Math.abs(Math.cos(weaponBob * 4)) * (moving ? 0.02 : 0.007);

      camera.position.set(player.x, EYE_HEIGHT + player.jumpOffset, player.z);
      camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

      skyDome.position.set(camera.position.x, 0, camera.position.z);
      skyBottom.position.set(camera.position.x, 0, camera.position.z);

      const fovScale =
        Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5) /
        Math.tan(THREE.MathUtils.degToRad(BASE_FOV) * 0.5);

      // В высоком прыжке оружие немного "проваливается" — эффект свободного падения
      const jumpDip = player.jumpOffset * 0.12;

      weaponGroup.scale.setScalar(fovScale);
      weaponGroup.position.set(
        (WEAPON_POS.x + bobX) * fovScale,
        (WEAPON_POS.y + bobY) * fovScale - jumpDip,
        WEAPON_POS.z + weaponRecoil
      );
      weaponGroup.rotation.x = -weaponRecoil * 2.5;
      weaponGroup.rotation.y = -bobX * 0.5;

      if (player.invuln > 0) {
        const shake = player.invuln * 0.08;
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
      }
    }

    const _projVec = new THREE.Vector3();
    function drawEnemyHealthBars() {
      for (const e of enemies) {
        _projVec.set(e.x, e.y + e.r * 0.9 + 0.5, e.z);
        _projVec.project(camera);

        if (_projVec.z > 1) continue;

        const sx = (_projVec.x * 0.5 + 0.5) * view.cssW;
        const sy = (-_projVec.y * 0.5 + 0.5) * view.cssH;

        if (sx < -100 || sx > view.cssW + 100 || sy < -60 || sy > view.cssH + 60) continue;

        const dist = Math.hypot(e.x - player.x, e.z - player.z);
        const barW = Math.max(30, Math.min(90, 1200 / (dist + 8)));
        const barH = Math.max(5, Math.min(8, barW * 0.1));
        const x = sx - barW / 2;
        const y = sy;

        const hpRatio = Math.max(0, Math.min(1, e.hp / e.maxHp));

        ctx.fillStyle = "rgba(0,0,0,0.72)";
        ctx.fillRect(x - 1, y - 1, barW + 2, barH + 2);

        const hue = hpRatio * 120;
        ctx.fillStyle = `hsl(${hue}, 78%, 55%)`;
        ctx.fillRect(x, y, barW * hpRatio, barH);

        ctx.strokeStyle = "rgba(255,255,255,0.55)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, barW - 1, barH - 1);
      }
    }

    function drawHUD() {
      const pad = 12;
      const fontSize = Math.max(13, Math.min(18, view.cssW / 42));
      const panelW = Math.min(320, view.cssW * 0.6);
      const panelH = fontSize * 4 + 34;

      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(pad, pad, panelW, panelH);

      ctx.fillStyle = "#e6e6f0";
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = "left";
      ctx.fillText(`Счёт: ${score}`, pad + 12, pad + fontSize + 8);
      ctx.fillText(`Волна: ${wave}`, pad + 12, pad + fontSize * 2 + 14);
      ctx.fillText(`Оружие: ${weapons[player.weapon].name}`, pad + 12, pad + fontSize * 3 + 20);

      const barX = pad + 12, barY = pad + panelH - 18, barW = panelW - 24, barH = 10;
      const hpRatio = Math.max(0, player.hp / player.maxHp);
      ctx.fillStyle = "#222";
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = hpRatio > 0.35 ? "#58d68d" : "#ff5d5d";
      ctx.fillRect(barX, barY, barW * hpRatio, barH);

      drawEnemyHealthBars();

      const cx = view.cssW / 2, cy = view.cssH / 2;
      const gap = 6, length = 12, thickness = 2;
      ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
      ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
      ctx.lineWidth = 1;

      ctx.fillRect(cx - thickness/2, cy - gap - length, thickness, length);
      ctx.strokeRect(cx - thickness/2, cy - gap - length, thickness, length);
      ctx.fillRect(cx - thickness/2, cy + gap, thickness, length);
      ctx.strokeRect(cx - thickness/2, cy + gap, thickness, length);
      ctx.fillRect(cx - gap - length, cy - thickness/2, length, thickness);
      ctx.strokeRect(cx - gap - length, cy - thickness/2, length, thickness);
      ctx.fillRect(cx + gap, cy - thickness/2, length, thickness);
      ctx.strokeRect(cx + gap, cy - thickness/2, length, thickness);

      ctx.beginPath();
      ctx.arc(cx, cy, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawJoystick(start, current, radius, color) {
      const vec = stickVector(start, current, radius, 0);
      const knobX = start.x + vec.x * radius, knobY = start.y + vec.y * radius;
      ctx.save();
      ctx.globalAlpha = 0.2; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(start.x, start.y, radius, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.4; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.lineTo(knobX, knobY); ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(knobX, knobY, 28, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawStaticJoystickHint(x, y, radius, color, label) {
      ctx.save();
      ctx.globalAlpha = 0.15; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.25; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.4; ctx.fillStyle = color; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
      ctx.fillText(label, x, y + 4);
      ctx.restore();
    }

    function drawTouchControls() {
      if (state !== "playing" || !isTouchDevice) return;

      if (touch.moveId === null) {
        drawStaticJoystickHint(view.cssW * 0.2, view.cssH * 0.75, 50, "rgba(255,255,255,0.4)", "ДВИЖЕНИЕ");
      } else {
        drawJoystick(touch.moveStart, touch.moveCurrent, MOVE_RADIUS, "rgba(255, 255, 255, 0.6)");
      }

      if (touch.lookId === null) {
         ctx.save();
         ctx.globalAlpha = 0.15;
         ctx.fillStyle = "#ffffff";
         ctx.font = "bold 13px Arial";
         ctx.textAlign = "center";
         ctx.fillText("ПРОВОДИТЕ ЗДЕСЬ ДЛЯ ОБЗОРА", view.cssW * 0.75, view.cssH * 0.5);
         ctx.restore();
      }
    }

    function drawMenu() {
      ctx.fillStyle = "rgba(20,10,5,0.62)";
      ctx.fillRect(0, 0, view.cssW, view.cssH);
      ctx.textAlign = "center";
      const titleSize = Math.max(28, Math.min(64, view.cssW / 12));
      const textSize = Math.max(14, Math.min(22, view.cssW / 36));
      ctx.fillStyle = "#fff2d8"; ctx.font = `bold ${titleSize}px Arial`;
      ctx.fillText("MASKED MERC FPS 3D", view.cssW / 2, view.cssH * 0.22);
      ctx.fillStyle = "#ffb070";
      ctx.font = `bold ${textSize * 1.1}px Arial`;
      ctx.fillText("ЗОНА БОЕВЫХ ДЕЙСТВИЙ", view.cssW / 2, view.cssH * 0.22 + titleSize * 0.55);
      ctx.font = `${textSize}px Arial`;
      ctx.fillStyle = "#e6d8c0";
      const lines = isTouchDevice
        ? ["Левая часть экрана — движение (джойстик)",
           "Правая часть экрана — поворот камеры",
           "Кнопка ОГОНЬ — стрельба, ПРЫЖОК — прыжок",
           "Кнопка ⏸ вверху справа — пауза"]
        : ["WASD — движение, ПРОБЕЛ — прыжок",
           "Мышь — обзор (кликните для захвата курсора)",
           "ЛКМ — стрельба, ESC — пауза / освободить курсор"];
      lines.forEach((line, i) => ctx.fillText(line, view.cssW / 2, view.cssH * 0.44 + textSize * 1.7 * i));
      ctx.fillStyle = "#ffd76a";
      ctx.fillText("Коснись или кликни, чтобы начать", view.cssW / 2, view.cssH * 0.84);
      ctx.textAlign = "left";
    }

    function drawGameOver() {
      ctx.fillStyle = "rgba(20,10,5,0.7)";
      ctx.fillRect(0, 0, view.cssW, view.cssH);
      ctx.textAlign = "center";
      const titleSize = Math.max(28, Math.min(64, view.cssW / 12));
      const textSize = Math.max(16, Math.min(28, view.cssW / 28));
      ctx.fillStyle = "#ff8a6a"; ctx.font = `bold ${titleSize}px Arial`;
      ctx.fillText("ИГРА ОКОНЧЕНА", view.cssW / 2, view.cssH * 0.35);
      ctx.fillStyle = "#fff"; ctx.font = `${textSize}px Arial`;
      ctx.fillText(`Счёт: ${score}`, view.cssW / 2, view.cssH * 0.5);
      ctx.fillText(`Волна: ${wave}`, view.cssW / 2, view.cssH * 0.5 + textSize * 1.7);
      ctx.fillStyle = "#ffd76a";
      ctx.fillText("Коснись или кликни, чтобы начать заново", view.cssW / 2, view.cssH * 0.78);
      ctx.textAlign = "left";
    }

    function drawPause() {
      ctx.fillStyle = "rgba(20,10,5,0.75)";
      ctx.fillRect(0, 0, view.cssW, view.cssH);
      ctx.textAlign = "center";
      const titleSize = Math.max(32, Math.min(72, view.cssW / 10));
      const textSize = Math.max(15, Math.min(22, view.cssW / 34));
      ctx.fillStyle = "#fff2d8"; ctx.font = `bold ${titleSize}px Arial`;
      ctx.fillText("ПАУЗА", view.cssW / 2, view.cssH * 0.44);
      ctx.font = `${textSize}px Arial`;
      ctx.fillStyle = "#ffd76a";
      ctx.fillText(
        isTouchDevice ? "Нажми ⏸ или коснись экрана, чтобы продолжить"
                      : "Нажми ПРОБЕЛ, ESC или кликни, чтобы продолжить",
        view.cssW / 2, view.cssH * 0.58
      );
      ctx.textAlign = "left";
    }

    function drawRotateHint() {
      if (isTouchDevice && view.cssH > view.cssW) {
        ctx.fillStyle = "rgba(20,10,5,0.6)";
        ctx.fillRect(0, 0, view.cssW, view.cssH);
        ctx.fillStyle = "#fff"; ctx.font = "bold 26px Arial"; ctx.textAlign = "center";
        ctx.fillText("Поверни устройство горизонтально", view.cssW / 2, view.cssH / 2);
        ctx.textAlign = "left";
      }
    }

    function drawUI() {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.clearRect(0, 0, view.cssW, view.cssH);
      if (state === "playing") { drawHUD(); drawTouchControls(); }
      if (state === "menu") drawMenu();
      if (state === "gameover") drawGameOver();
      if (state === "paused") drawPause();
      drawRotateHint();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.035);
      last = now;
      globalTime += dt;
      update(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
      drawUI();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function isFullscreen() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }

    async function toggleFullscreen() {
      const doc = document, elem = document.documentElement;
      try {
        if (!isFullscreen()) {
          if (elem.requestFullscreen) await elem.requestFullscreen({ navigationUI: "hide" });
          else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            try { await screen.orientation.lock("landscape"); } catch (e) {}
          }
        } else {
          if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          if (doc.exitFullscreen) await doc.exitFullscreen();
          else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
        }
      } catch (err) { console.warn("Fullscreen error:", err); }
      setTimeout(resize, 150);
    }

    function updateFullscreenButton() {
      fullscreenBtn.textContent = isFullscreen() ? "✕ Выйти" : "⛶ Полный экран";
    }

    function updatePauseButton() {
      pauseBtn.textContent = state === "paused" ? "▶" : "⏸";
      pauseBtn.style.display = (state === "playing" || state === "paused") ? "" : "none";
    }

    function togglePause() {
      if (state === "playing") {
        state = "paused";
        mouseDown = false;
        touch.fireBtnDown = false;
        touch.moveId = null;
        touch.lookId = null;
        touch.moveVector = { x: 0, y: 0 };
        for (const k in keys) keys[k] = false;
        if (document.exitPointerLock) { try { document.exitPointerLock(); } catch (e) {} }
      } else if (state === "paused") {
        state = "playing";
        last = performance.now();
        if (!isTouchDevice && sceneCanvas.requestPointerLock) {
          try { sceneCanvas.requestPointerLock(); } catch (e) {}
        }
      }
      updatePauseButton();
    }

    fullscreenBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); });
    pauseBtn.addEventListener("click", (e) => { e.stopPropagation(); togglePause(); });
    document.addEventListener("fullscreenchange", () => { updateFullscreenButton(); setTimeout(resize, 100); });
    document.addEventListener("webkitfullscreenchange", () => { updateFullscreenButton(); setTimeout(resize, 100); });

    sceneCanvas.addEventListener("click", (e) => {
      if (state === "paused") { togglePause(); return; }
      if (state !== "playing") { startGame(); return; }
      if (!isTouchDevice && !pointerLocked && sceneCanvas.requestPointerLock) {
        try { sceneCanvas.requestPointerLock(); } catch (err) {}
      }
    });

    document.addEventListener("pointerlockchange", () => {
      const wasLocked = pointerLocked;
      pointerLocked = document.pointerLockElement === sceneCanvas;
      if (!isTouchDevice && wasLocked && !pointerLocked && state === "playing") {
        togglePause();
      }
    });

    sceneCanvas.addEventListener("mousemove", (e) => {
      if (!pointerLocked) return;
      mouseLookAccum.x += e.movementX || 0;
      mouseLookAccum.y += e.movementY || 0;
    });

    sceneCanvas.addEventListener("mousedown", (e) => {
      if (e.button === 0) {
        mouseDown = true;
        if (state !== "playing") {
          if (state === "menu" || state === "gameover") startGame();
        }
      }
    });

    window.addEventListener("mouseup", (e) => { if (e.button === 0) mouseDown = false; });

    fireBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); 
      e.stopPropagation();
      touch.fireBtnDown = true;
      if (state === "menu" || state === "gameover") startGame();
    }, { passive: false });

    fireBtn.addEventListener("pointerup", (e) => {
      e.preventDefault(); 
      e.stopPropagation(); 
      touch.fireBtnDown = false;
    }, { passive: false });

    fireBtn.addEventListener("pointercancel", () => { touch.fireBtnDown = false; });

    jumpBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      tryJump();
    }, { passive: false });

    sceneCanvas.addEventListener("pointerdown", (e) => {
      if (!isTouchDevice) return;
      e.preventDefault();

      if (state === "paused") { togglePause(); return; }
      if (state !== "playing") { startGame(); return; }

      const isLeftSide = e.clientX < view.cssW * 0.6;

      if (isLeftSide && touch.moveId === null) {
        touch.moveId = e.pointerId;
        touch.moveStart = { x: e.clientX, y: e.clientY };
        touch.moveCurrent = { x: e.clientX, y: e.clientY };
      } else if (!isLeftSide && touch.lookId === null) {
        touch.lookId = e.pointerId;
        touch.lookLast = { x: e.clientX, y: e.clientY };
      }
      updateTouchVectors();
    }, { passive: false });

    sceneCanvas.addEventListener("pointermove", (e) => {
      if (!isTouchDevice) return;
      e.preventDefault(); 

      if (e.pointerId === touch.moveId) {
        touch.moveCurrent = { x: e.clientX, y: e.clientY };
        updateTouchVectors();
      }

      if (e.pointerId === touch.lookId) {
        const dx = e.clientX - touch.lookLast.x;
        const dy = e.clientY - touch.lookLast.y;

        player.yaw -= dx * LOOK_SENS_TOUCH;
        player.pitch -= dy * LOOK_SENS_TOUCH;
        clampPitch();

        touch.lookLast = { x: e.clientX, y: e.clientY };
      }
    }, { passive: false });

    function releasePointer(e) {
      if (e.pointerId === touch.moveId) {
        touch.moveId = null;
        touch.moveVector = { x: 0, y: 0 };
      }
      if (e.pointerId === touch.lookId) {
        touch.lookId = null;
      }
    }

    sceneCanvas.addEventListener("pointerup", releasePointer);
    sceneCanvas.addEventListener("pointercancel", releasePointer);

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) e.preventDefault();

      if (key === " ") {
        if (state === "playing") tryJump();
        else if (state === "paused") togglePause();
        else startGame();
      }
      if (key === "enter") {
        if (state === "menu" || state === "gameover") startGame();
      }
      if (key === "escape") {
        if (state === "playing") togglePause();
        else if (state === "paused") togglePause();
      }
    });

    window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
    sceneCanvas.addEventListener("contextmenu", (e) => e.preventDefault());

    updateFullscreenButton();
    updatePauseButton();
  </script>
</body>
  </html>
