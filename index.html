<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>Masked Merc FPS 3D</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05050a;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }
    body { font-family: Arial, sans-serif; }
    #scene, #ui {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    #scene { z-index: 1; touch-action: none; }
    #ui { z-index: 2; pointer-events: none; }
    
    .touchOnly { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .touchOnly { display: block; }
    }
    
    #fullscreenBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      padding: 10px 14px;
      font-size: 16px;
      color: #fff;
      background: rgba(15, 15, 25, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      touch-action: manipulation;
      cursor: pointer;
    }
    #fireBtn {
      position: fixed;
      right: 26px;
      bottom: 80px;
      z-index: 10;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      background: rgba(220, 40, 40, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.4);
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #fireBtn:active { background: rgba(220, 40, 40, 0.85); }
  </style>
</head>

<body>
  <button id="fullscreenBtn">⛶ Полный экран</button>
  <button id="fireBtn" class="touchOnly">ОГОНЬ</button>

  <canvas id="scene"></canvas>
  <canvas id="ui"></canvas>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const sceneCanvas = document.getElementById("scene");
    const uiCanvas = document.getElementById("ui");
    const ctx = uiCanvas.getContext("2d");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const fireBtn = document.getElementById("fireBtn");

    const renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, antialias: true });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05050a);
    scene.fog = new THREE.Fog(0x05050a, 40, 120);

    const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 500);

    const BASE_FOV = 75;
    const BASE_ASPECT = 16 / 9;

    let view = { dpr: 1, cssW: 1, cssH: 1 };

    function resize() {
      const vv = window.visualViewport;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssW = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
      const cssH = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
      view = { dpr, cssW, cssH };

      renderer.setPixelRatio(dpr);
      renderer.setSize(cssW, cssH, false);

      sceneCanvas.style.width = cssW + "px";
      sceneCanvas.style.height = cssH + "px";

      camera.aspect = cssW / cssH;

      const hFov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_FOV) / 2) * BASE_ASPECT);
      let fov = 2 * Math.atan(Math.tan(hFov / 2) / camera.aspect) * 180 / Math.PI;
      camera.fov = Math.min(100, Math.max(55, fov));
      camera.updateProjectionMatrix();

      uiCanvas.width = Math.floor(cssW * dpr);
      uiCanvas.height = Math.floor(cssH * dpr);
      uiCanvas.style.width = cssW + "px";
      uiCanvas.style.height = cssH + "px";
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 150));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resize);
      window.visualViewport.addEventListener("scroll", resize);
    }
    resize();

    const HALF_W = 48;
    const HALF_D = 27;
    const obstacles = [];

    // ============================================================
    //  ПРОЦЕДУРНЫЕ ТЕКСТУРЫ АРЕНЫ
    // ============================================================
    function makeTexture(size, drawFn, repeatX = 1, repeatY = 1) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      drawFn(g, size);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.anisotropy = 4;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function drawConcrete(g, s) {
      g.fillStyle = '#1a1b24';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 6000; i++) {
        const v = Math.random();
        const alpha = Math.random() * 0.12;
        g.fillStyle = v > 0.5 ? `rgba(200,210,240,${alpha})` : `rgba(0,0,0,${alpha})`;
        g.fillRect(Math.random() * s, Math.random() * s, 2, 2);
      }
      g.strokeStyle = 'rgba(0,0,0,0.35)';
      g.lineWidth = 1;
      for (let i = 0; i < 10; i++) {
        g.beginPath();
        let x = Math.random() * s, y = Math.random() * s;
        g.moveTo(x, y);
        for (let j = 0; j < 6; j++) {
          x += (Math.random() - 0.5) * 40;
          y += (Math.random() - 0.5) * 40;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      g.strokeStyle = 'rgba(90,110,180,0.4)';
      g.lineWidth = 2;
      const step = s / 4;
      for (let i = 0; i <= s; i += step) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i, s); g.stroke();
        g.beginPath(); g.moveTo(0, i); g.lineTo(s, i); g.stroke();
      }
      g.fillStyle = 'rgba(130,160,255,0.55)';
      for (let x = 0; x <= s; x += step) {
        for (let y = 0; y <= s; y += step) {
          g.beginPath(); g.arc(x, y, 2.5, 0, Math.PI * 2); g.fill();
        }
      }
    }

    function drawPanel(g, s) {
      g.fillStyle = '#22232c';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 3000; i++) {
        g.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,255,255'},${Math.random() * 0.06})`;
        g.fillRect(Math.random() * s, Math.random() * s, 2, 2);
      }
      g.strokeStyle = '#0f1017';
      g.lineWidth = 5;
      g.strokeRect(8, 8, s - 16, s - 16);
      g.beginPath();
      g.moveTo(s / 2, 8); g.lineTo(s / 2, s - 8);
      g.moveTo(8, s / 2); g.lineTo(s - 8, s / 2);
      g.stroke();
      const n = 4;
      const rivets = [];
      for (let i = 1; i <= n; i++) {
        const t = i / (n + 1);
        rivets.push([8 + (s - 16) * t, 8]);
        rivets.push([8 + (s - 16) * t, s - 8]);
        rivets.push([8, 8 + (s - 16) * t]);
        rivets.push([s - 8, 8 + (s - 16) * t]);
      }
      for (const [x, y] of rivets) {
        const grad = g.createRadialGradient(x - 1, y - 1, 0, x, y, 4);
        grad.addColorStop(0, '#7a7b8c');
        grad.addColorStop(1, '#2a2b36');
        g.fillStyle = grad;
        g.beginPath(); g.arc(x, y, 3.5, 0, Math.PI * 2); g.fill();
      }
    }

    function drawMetalPanel(g, s) {
      g.fillStyle = '#181a22';
      g.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 3) {
        const alpha = Math.random() * 0.08;
        g.fillStyle = `rgba(200,210,240,${alpha})`;
        g.fillRect(0, y, s, 1);
      }
      for (let i = 0; i < 1200; i++) {
        g.fillStyle = `rgba(0,0,0,${Math.random() * 0.15})`;
        g.fillRect(Math.random() * s, Math.random() * s, 3, 3);
      }
      g.strokeStyle = '#0a0b10';
      g.lineWidth = 8;
      g.strokeRect(4, 4, s - 8, s - 8);
      g.strokeStyle = 'rgba(120,140,200,0.3)';
      g.lineWidth = 1;
      g.strokeRect(9, 9, s - 18, s - 18);
    }

    const floorTex = makeTexture(512, drawConcrete, 12, 7);
    const outerFloorTex = makeTexture(512, drawConcrete, 16, 12);
    const wallTex = makeTexture(256, drawPanel, 1, 1);
    const obstacleTex = makeTexture(256, drawMetalPanel, 1, 1);

    // ============================================================
    //  ГЕОМЕТРИЯ АРЕНЫ
    // ============================================================
    const outerFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(280, 220),
      new THREE.MeshStandardMaterial({ map: outerFloorTex, color: 0x666677, roughness: 1 })
    );
    outerFloor.rotation.x = -Math.PI / 2;
    outerFloor.position.y = -0.08;
    outerFloor.receiveShadow = true;
    scene.add(outerFloor);

    const arenaFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(HALF_W * 2, HALF_D * 2),
      new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 })
    );
    arenaFloor.rotation.x = -Math.PI / 2;
    arenaFloor.receiveShadow = true;
    scene.add(arenaFloor);

    const grid = new THREE.GridHelper(HALF_W * 2, 24, 0x3b4b7a, 0x1a1f33);
    grid.scale.z = HALF_D / HALF_W;
    grid.position.y = 0.02;
    grid.material.opacity = 0.35;
    grid.material.transparent = true;
    scene.add(grid);

    function addWall(x, z, w, d, h) {
      const tex = wallTex.clone();
      tex.needsUpdate = true;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(Math.max(1, Math.round(Math.max(w, d) * 0.25)), 1);
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    addWall(0, -HALF_D - 0.5, HALF_W * 2 + 2, 1, 3);
    addWall(0, HALF_D + 0.5, HALF_W * 2 + 2, 1, 3);
    addWall(-HALF_W - 0.5, 0, 1, HALF_D * 2, 3);
    addWall(HALF_W + 0.5, 0, 1, HALF_D * 2, 3);

    const GLOW_BLUE = 0x4488ff;
    function addGlowStrip(x, y, z, w, h, d, color, intensity = 1.4) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({
          color: 0x000000,
          emissive: color,
          emissiveIntensity: intensity,
          roughness: 0.4,
          metalness: 0.2
        })
      );
      mesh.position.set(x, y, z);
      scene.add(mesh);
      return mesh;
    }

    addGlowStrip(0, 2.85, -HALF_D - 0.47, HALF_W * 2, 0.08, 0.08, GLOW_BLUE);
    addGlowStrip(0, 2.85, HALF_D + 0.47, HALF_W * 2, 0.08, 0.08, GLOW_BLUE);
    addGlowStrip(-HALF_W - 0.47, 2.85, 0, 0.08, 0.08, HALF_D * 2, GLOW_BLUE);
    addGlowStrip(HALF_W + 0.47, 2.85, 0, 0.08, 0.08, HALF_D * 2, GLOW_BLUE);

    const obstacleData = [
      { x: -28.7, z: -8.5, w: 4.6, d: 15, h: 4 },
      { x: 28.7, z: -8.5, w: 4.6, d: 15, h: 4 },
      { x: -28.7, z: 8.5, w: 4.6, d: 15, h: 4 },
      { x: 28.7, z: 8.5, w: 4.6, d: 15, h: 4 },
      { x: 0, z: -9.3, w: 14, d: 3.4, h: 3 },
      { x: 0, z: 9.3, w: 14, d: 3.4, h: 3 },
      { x: -36, z: 0, w: 10, d: 2.6, h: 2.5 },
      { x: 36, z: 0, w: 10, d: 2.6, h: 2.5 }
    ];

    function addObstacle(x, z, w, d, h) {
      const tex = obstacleTex.clone();
      tex.needsUpdate = true;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(Math.max(1, Math.round(w * 0.35)), Math.max(1, Math.round(h * 0.5)));
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0.15 });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    for (const o of obstacleData) {
      addObstacle(o.x, o.z, o.w, o.d, o.h);
      obstacles.push(o);
      addGlowStrip(o.x, o.h + 0.04, o.z, o.w * 0.92, 0.06, o.d * 0.92, 0xff5522, 1.1);
    }

    function addCrate(x, z, size = 1.4) {
      const tex = obstacleTex.clone();
      tex.needsUpdate = true;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size, size, size),
        new THREE.MeshStandardMaterial({ map: tex, color: 0xb08a55, roughness: 0.9 })
      );
      mesh.position.set(x, size / 2, z);
      mesh.rotation.y = (Math.random() - 0.5) * 0.4;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      obstacles.push({ x, z, w: size * 0.9, d: size * 0.9, h: size });
      return mesh;
    }

    addCrate(-17.5, -18.5, 1.7);
    addCrate(-15.6, -19.0, 1.3);
    addCrate(20.0, 15.5, 1.5);
    addCrate(18.7, 17.3, 1.2);
    addCrate(-33.0, 19.5, 1.7);
    addCrate(34.5, -18.0, 1.4);
    addCrate(35.8, -16.5, 1.1);

    function addPillar(x, z, h = 5, color = 0x4488ff) {
      const pillarMat = new THREE.MeshStandardMaterial({
        map: obstacleTex.clone(),
        roughness: 0.7,
        metalness: 0.5
      });
      pillarMat.map.needsUpdate = true;
      pillarMat.map.wrapS = pillarMat.map.wrapT = THREE.RepeatWrapping;
      pillarMat.map.repeat.set(1, 2);
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, h, 12), pillarMat);
      body.position.set(x, h / 2, z);
      body.castShadow = true;
      body.receiveShadow = true;
      scene.add(body);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.08, 8, 20),
        new THREE.MeshStandardMaterial({
          color: 0x000000,
          emissive: color,
          emissiveIntensity: 2.0
        })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.set(x, h - 0.3, z);
      scene.add(ring);
    }

    addPillar(-44.5, -22.5, 5.5, 0x4488ff);
    addPillar(44.5, -22.5, 5.5, 0x4488ff);
    addPillar(-44.5, 22.5, 5.5, 0x4488ff);
    addPillar(44.5, 22.5, 5.5, 0x4488ff);

    // ============================================================
    //  ОСВЕЩЕНИЕ
    // ============================================================
    scene.add(new THREE.AmbientLight(0x8888aa, 0.5));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(30, 60, 25);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 150;
    keyLight.shadow.camera.left = -60;
    keyLight.shadow.camera.right = 60;
    keyLight.shadow.camera.top = 60;
    keyLight.shadow.camera.bottom = -60;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x5566ff, 0.35);
    fillLight.position.set(-30, 20, -40);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xff7733, 0.2);
    rimLight.position.set(0, -20, 0);
    scene.add(rimLight);

    // ============================================================
    //  МОДЕЛЬ ОРУЖИЯ
    // ============================================================
    const weaponGroup = new THREE.Group();
    const gunBody = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 0.22, 0.9),
      new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.55, metalness: 0.4 })
    );
    const gunBarrel = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 0.1, 0.6),
      new THREE.MeshStandardMaterial({ color: 0x2a2a34, roughness: 0.4, metalness: 0.7 })
    );
    gunBarrel.position.set(0, 0.06, 0.65);

    const gunHandle = new THREE.Mesh(
      new THREE.BoxGeometry(0.14, 0.35, 0.2),
      new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.7 })
    );
    gunHandle.position.set(0, -0.25, -0.2);

    const magazine = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.3, 0.15),
      new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.7 })
    );
    magazine.position.set(0, -0.2, 0.1);

    const hand = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.14, 0.4),
      new THREE.MeshStandardMaterial({ color: 0x0c0c14, roughness: 0.8 })
    );
    hand.position.set(0, -0.15, -0.05);

    weaponGroup.add(gunBody, gunBarrel, gunHandle, magazine, hand);
    
    const muzzleFlash = new THREE.PointLight(0xffaa00, 0, 6);
    muzzleFlash.position.set(0, 0.15, 1.0);
    weaponGroup.add(muzzleFlash);

    camera.add(weaponGroup);
    scene.add(camera);

    const WEAPON_POS = new THREE.Vector3(0.32, -0.28, -0.5);
    weaponGroup.position.copy(WEAPON_POS);
    weaponGroup.rotation.set(0, -0.08, 0.05);

    // ============================================================
    //  ПРЕДЗАГРУЗКА ТЕКСТУРЫ ЛИЦА ВРАГА
    // ============================================================
    const FACE_IMAGE_PATH = './putin.jpg';

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    const FALLBACK_COLORS = {
      runner: 0xbf4654,
      shooter: 0xc47b21,
      brute: 0x8d3040
    };
    const EMISSIVE_COLORS = {
      runner: 0x330810,
      shooter: 0x3a1e00,
      brute: 0x2a0810
    };

    let faceTexture = null;
    let faceTextureReady = false;
    let faceTextureFailed = false;
    let faceAspect = 1;

    // Радиусы капсул — общие для коллизий, отрисовки и позиционирования лица
    const enemyRadii = { runner: 1.2, shooter: 1.3, brute: 2.1 };

    const textureLoadedPromise = new Promise((resolve) => {
      textureLoader.load(
        FACE_IMAGE_PATH,
        (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
          tex.anisotropy = 4;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          tex.magFilter = THREE.LinearFilter;

          if (tex.image && tex.image.width && tex.image.height) {
            faceAspect = tex.image.width / tex.image.height;
          }

          faceTexture = tex;
          faceTextureReady = true;
          console.log('[Masked Merc] Текстура врага загружена:', FACE_IMAGE_PATH);

          // Догружаем на уже живых врагов
          for (const e of enemies) attachFaceToEnemy(e);

          resolve(true);
        },
        undefined,
        (err) => {
          faceTextureFailed = true;
          console.warn(
            '[Masked Merc] Не удалось загрузить текстуру врага:', FACE_IMAGE_PATH,
            '\nПроверь, что файл лежит рядом с index.html и путь указан верно.',
            err
          );
          resolve(false);
        }
      );
    });

    // Тело врага (капсула) — просто цветное. Лицо будет отдельной
    // billboard-табличкой поверх капсулы.
    const enemyMats = {
      runner: new THREE.MeshStandardMaterial({
        color: FALLBACK_COLORS.runner,
        emissive: EMISSIVE_COLORS.runner,
        roughness: 0.8
      }),
      shooter: new THREE.MeshStandardMaterial({
        color: FALLBACK_COLORS.shooter,
        emissive: EMISSIVE_COLORS.shooter,
        roughness: 0.8
      }),
      brute: new THREE.MeshStandardMaterial({
        color: FALLBACK_COLORS.brute,
        emissive: EMISSIVE_COLORS.brute,
        roughness: 0.8
      })
    };

    const enemyGeos = {
      runner: new THREE.CapsuleGeometry(1.2, 1.2, 6, 12),
      shooter: new THREE.CapsuleGeometry(1.3, 1.2, 6, 12),
      brute: new THREE.CapsuleGeometry(2.1, 1.6, 6, 12)
    };

    // ============================================================
    //  BILLBOARD-ЛИЦО ПЕРЕД ВРАГОМ
    // ============================================================
    //  Плоскость с лицом НЕ привязана к врагу как child — она лежит
    //  прямо в сцене. Каждый кадр её позиция и ориентация
    //  пересчитываются так, чтобы она:
    //    1) стояла перед врагом со стороны игрока,
    //    2) была развёрнута нормалью прямо на камеру (lookAt).
    //  Поэтому с какого бы угла вы ни смотрели — вы видите лицо
    //  строго анфас, без «заваливания» и без боковых видов.
    // ============================================================
    function attachFaceToEnemy(enemy) {
      if (!faceTexture || !enemy) return;
      if (enemy.facePlane) return;

      const r = enemyRadii[enemy.type] || 1.3;
      const h = r * 1.7;
      const w = h * (faceAspect || 1);

      const geo = new THREE.PlaneGeometry(w, h);
      const mat = new THREE.MeshBasicMaterial({
        map: faceTexture,
        transparent: true,
        toneMapped: false,
        side: THREE.DoubleSide, // На всякий случай — если что-то пойдёт не так,
                                // задняя сторона тоже будет отрисована
        depthWrite: true
      });

      const plane = new THREE.Mesh(geo, mat);
      plane.renderOrder = 2;
      scene.add(plane);
      enemy.facePlane = plane;

      // Сразу ставим в правильную позицию, чтобы не мигало в (0,0,0)
      updateFacePlaneTransform(enemy);
    }

    function updateFacePlaneTransform(enemy) {
      const plane = enemy.facePlane;
      if (!plane) return;

      const r = enemyRadii[enemy.type] || 1.3;

      // Горизонтальное направление от врага к камере
      const dx = camera.position.x - enemy.x;
      const dz = camera.position.z - enemy.z;
      const dh = Math.hypot(dx, dz) || 1;
      const ux = dx / dh, uz = dz / dh;

      // Ставим табличку на радиусе капсулы в сторону игрока
      plane.position.set(
        enemy.x + ux * (r + 0.06),
        enemy.y + 0.15,
        enemy.z + uz * (r + 0.06)
      );

      // Разворачиваем нормаль на камеру. Держим Y одинаковым,
      // чтобы табличка не «задирала нос» вверх/вниз — так лицо
      // всегда стоит вертикально.
      plane.lookAt(
        camera.position.x,
        plane.position.y,
        camera.position.z
      );
    }

    const enemyY = { runner: 1.8, shooter: 1.9, brute: 2.9 };
    const tracerGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.0, 6);
    tracerGeo.rotateX(Math.PI / 2);

    const friendlyTracerMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
    const enemyTracerMat = new THREE.MeshBasicMaterial({ color: 0xff4444 });

    const pickupGeo = new THREE.BoxGeometry(2.2, 0.9, 1.4);
    const pickupMats = {
      smg: new THREE.MeshStandardMaterial({ color: 0xffc107, emissive: 0x4a3400, roughness: 0.5 }),
      shotgun: new THREE.MeshStandardMaterial({ color: 0xff7043, emissive: 0x4a1c00, roughness: 0.5 }),
      medkit: new THREE.MeshStandardMaterial({ color: 0x4caf50, emissive: 0x0d3d13, roughness: 0.5 })
    };

    // ============================================================
    //  ОРУЖИЕ
    // ============================================================
    const weapons = [
      { name: "Пистолет", damage: 14, fireDelay: 0.22, speed: 80, pellets: 1, spread: 0.015 },
      { name: "Пистолет-пулемёт", damage: 8, fireDelay: 0.09, speed: 85, pellets: 1, spread: 0.05 },
      { name: "Дробовик", damage: 9, fireDelay: 0.7, speed: 70, pellets: 7, spread: 0.15 }
    ];

    let state = "menu";
    let globalTime = 0;
    let score = 0;
    let wave = 1;
    let spawnQueue = 0;
    let spawnTimer = 0;
    let betweenWaveTimer = 1;

    const EYE_HEIGHT = 2.1;

    const player = {
      x: 0, z: 0, r: 0.7, speed: 12, hp: 100, maxHp: 100,
      weapon: 0, fireCooldown: 0, invuln: 0, yaw: 0, pitch: 0
    };

    let enemies = [];
    let bullets = [];
    let pickups = [];

    const keys = {};
    let mouseDown = false;
    let pointerLocked = false;

    const touch = {
      moveId: null,
      lookId: null,
      moveStart: { x: 0, y: 0 },
      moveCurrent: { x: 0, y: 0 },
      lookLast: { x: 0, y: 0 },
      moveVector: { x: 0, y: 0 },
      fireBtnDown: false
    };

    const MOVE_RADIUS = 65;
    const MOVE_DEAD = 8;
    const LOOK_SENS_TOUCH = 0.005;
    const LOOK_SENS_MOUSE = 0.0025;
    const isTouchDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;

    function clearEntities() {
      for (const e of enemies) {
        scene.remove(e.mesh);
        if (e.facePlane) scene.remove(e.facePlane);
      }
      for (const b of bullets) scene.remove(b.mesh);
      for (const p of pickups) scene.remove(p.mesh);
      enemies = []; bullets = []; pickups = [];
    }

    function startWave(n) {
      wave = n;
      spawnQueue = 5 + n * 3;
      spawnTimer = 0;
      betweenWaveTimer = 1.2;
    }

    function resetGame() {
      clearEntities();
      player.x = 0; player.z = 0; player.hp = player.maxHp;
      player.weapon = 0; player.fireCooldown = 0; player.invuln = 0;
      player.yaw = 0; player.pitch = 0;
      score = 0; wave = 1;
      startWave(1);
    }

    function startGame() {
      resetGame();
      state = "playing";
      if (!isTouchDevice && sceneCanvas.requestPointerLock) {
        try { sceneCanvas.requestPointerLock(); } catch (e) {}
      }
    }

    resetGame();

    function circleRectCollideXZ(x, z, r, o) {
      const minX = o.x - o.w / 2, maxX = o.x + o.w / 2;
      const minZ = o.z - o.d / 2, maxZ = o.z + o.d / 2;
      const closestX = Math.max(minX, Math.min(x, maxX));
      const closestZ = Math.max(minZ, Math.min(z, maxZ));
      const dx = x - closestX, dz = z - closestZ;
      return dx * dx + dz * dz < r * r;
    }

    function hitsObstacleOrBounds(x, z, r) {
      if (x - r < -HALF_W || x + r > HALF_W || z - r < -HALF_D || z + r > HALF_D) return true;
      for (const o of obstacles) {
        if (circleRectCollideXZ(x, z, r, o)) return true;
      }
      return false;
    }

    function moveWithCollision(entity, dx, dz) {
      if (dx !== 0) {
        const nx = entity.x + dx;
        if (!hitsObstacleOrBounds(nx, entity.z, entity.r)) entity.x = nx;
      }
      if (dz !== 0) {
        const nz = entity.z + dz;
        if (!hitsObstacleOrBounds(entity.x, nz, entity.r)) entity.z = nz;
      }
    }

    function dropPickup(x, z) {
      if (Math.random() > 0.18) return;
      const roll = Math.random();
      let type = "medkit";
      if (roll < 0.32) type = "smg";
      else if (roll < 0.58) type = "shotgun";

      const mesh = new THREE.Mesh(pickupGeo, pickupMats[type]);
      mesh.position.set(x, 1.2, z);
      mesh.castShadow = true;
      scene.add(mesh);

      pickups.push({ x, z, type, r: 1.6, ttl: 10, mesh, phase: Math.random() * Math.PI * 2 });
    }

    function spawnEnemy() {
      let type = "runner";
      const roll = Math.random();
      if (wave >= 3 && roll < 0.18) type = "brute";
      else if (wave >= 2 && roll < 0.48) type = "shooter";

      let r = enemyRadii[type];

      let x = -HALF_W + 4, z = -HALF_D + 4;
      for (let i = 0; i < 60; i++) {
        const side = Math.floor(Math.random() * 4);
        if (side === 0) { x = -HALF_W + 4 + Math.random() * (HALF_W * 2 - 8); z = -HALF_D + 4; }
        else if (side === 1) { x = -HALF_W + 4 + Math.random() * (HALF_W * 2 - 8); z = HALF_D - 4; }
        else if (side === 2) { x = -HALF_W + 4; z = -HALF_D + 4 + Math.random() * (HALF_D * 2 - 8); }
        else { x = HALF_W - 4; z = -HALF_D + 4 + Math.random() * (HALF_D * 2 - 8); }

        const distToPlayer = Math.hypot(x - player.x, z - player.z);
        if (!hitsObstacleOrBounds(x, z, r + 0.4) && distToPlayer > 18) break;
      }

      let hp, speed, damage, scoreValue, y;
      if (type === "brute") {
        hp = 70 + wave * 16; speed = 5 + wave * 0.15; damage = 22; scoreValue = 35; y = enemyY.brute;
      } else if (type === "shooter") {
        hp = 26 + wave * 6; speed = 6.2 + wave * 0.2; damage = 8; scoreValue = 18; y = enemyY.shooter;
      } else {
        hp = 18 + wave * 5; speed = 8 + wave * 0.3; damage = 10; scoreValue = 10; y = enemyY.runner;
      }

      const mesh = new THREE.Mesh(enemyGeos[type], enemyMats[type]);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      scene.add(mesh);

      const enemy = {
        type, x, z, y, r, hp, maxHp: hp, speed, damage, score: scoreValue, mesh,
        fireCooldown: 0.8 + Math.random() * 0.7, strafeDir: Math.random() < 0.5 ? -1 : 1,
        facePlane: null
      };

      attachFaceToEnemy(enemy);
      enemies.push(enemy);
    }

    // «Вперёд» совпадает с направлением взгляда камеры
    function getForwardXZ() { return { x: -Math.sin(player.yaw), z: -Math.cos(player.yaw) }; }
    function getRightXZ() { return { x: Math.cos(player.yaw), z: -Math.sin(player.yaw) }; }

    let weaponRecoil = 0;
    let weaponBob = 0;
    let flashTime = 0;

    function fireWeapon() {
      const weapon = weapons[player.weapon];
      player.fireCooldown = weapon.fireDelay;

      const direction = new THREE.Vector3();
      camera.getWorldDirection(direction);

      const muzzlePos = new THREE.Vector3();
      gunBarrel.getWorldPosition(muzzlePos);

      for (let i = 0; i < weapon.pellets; i++) {
        const bulletDir = direction.clone();
        bulletDir.x += (Math.random() - 0.5) * weapon.spread;
        bulletDir.y += (Math.random() - 0.5) * weapon.spread;
        bulletDir.z += (Math.random() - 0.5) * weapon.spread;
        bulletDir.normalize();

        const mesh = new THREE.Mesh(tracerGeo, friendlyTracerMat);
        const spawnPos = muzzlePos.clone().add(bulletDir.clone().multiplyScalar(0.5));
        mesh.position.copy(spawnPos);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), bulletDir);
        scene.add(mesh);

        bullets.push({
          x: spawnPos.x, y: spawnPos.y, z: spawnPos.z,
          vx: bulletDir.x * weapon.speed, vy: bulletDir.y * weapon.speed, vz: bulletDir.z * weapon.speed,
          r: 0.4, damage: weapon.damage, friendly: true, life: 1.5, mesh, is3D: true
        });
      }

      weaponRecoil = 0.15;
      flashTime = 0.05;
      muzzleFlash.intensity = 2.5;
    }

    function stickVector(start, current, radius, dead) {
      const dx = current.x - start.x, dy = current.y - start.y;
      const mag = Math.hypot(dx, dy);
      if (mag < dead) return { x: 0, y: 0 };
      const power = Math.min(mag, radius) / radius;
      return { x: (dx / mag) * power, y: (dy / mag) * power };
    }

    function updateTouchVectors() {
      touch.moveVector = touch.moveId === null ? { x: 0, y: 0 } : stickVector(touch.moveStart, touch.moveCurrent, MOVE_RADIUS, MOVE_DEAD);
    }

    function clampPitch() {
      const maxPitch = Math.PI / 2 - 0.05;
      if (player.pitch > maxPitch) player.pitch = maxPitch;
      if (player.pitch < -maxPitch) player.pitch = -maxPitch;
    }

    const mouseLookAccum = { x: 0, y: 0 };

    function update(dt) {
      if (state !== "playing") return;

      if (mouseLookAccum.x !== 0 || mouseLookAccum.y !== 0) {
        player.yaw -= mouseLookAccum.x * LOOK_SENS_MOUSE;
        player.pitch -= mouseLookAccum.y * LOOK_SENS_MOUSE;
        clampPitch();
        mouseLookAccum.x = 0; mouseLookAccum.y = 0;
      }

      let inputFwd = 0, inputRight = 0;
      if (keys["w"] || keys["arrowup"]) inputFwd += 1;
      if (keys["s"] || keys["arrowdown"]) inputFwd -= 1;
      if (keys["d"] || keys["arrowright"]) inputRight += 1;
      if (keys["a"] || keys["arrowleft"]) inputRight -= 1;

      if (touch.moveId !== null) {
        inputFwd -= touch.moveVector.y;
        inputRight += touch.moveVector.x;
      }

      const inputLen = Math.hypot(inputFwd, inputRight);
      if (inputLen > 1) { inputFwd /= inputLen; inputRight /= inputLen; }

      if (inputLen > 0.01) {
        const fwd = getForwardXZ();
        const right = getRightXZ();
        const dx = (fwd.x * inputFwd + right.x * inputRight) * player.speed * dt;
        const dz = (fwd.z * inputFwd + right.z * inputRight) * player.speed * dt;
        moveWithCollision(player, dx, dz);
      }

      const firing = mouseDown || touch.fireBtnDown;
      player.fireCooldown -= dt;
      player.invuln -= dt;

      if (firing && player.fireCooldown <= 0) fireWeapon();

      if (spawnQueue > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnEnemy();
          spawnQueue--;
          spawnTimer = Math.max(0.16, 0.75 - wave * 0.04);
        }
      }

      for (const e of enemies) {
        const dx = player.x - e.x, dz = player.z - e.z;
        const dist = Math.hypot(dx, dz) || 1;
        const nx = dx / dist, nz = dz / dist;
        let mx = 0, mz = 0;

        if (e.type === "shooter") {
          e.fireCooldown -= dt;
          if (dist > 28) { mx = nx; mz = nz; }
          else if (dist < 18) { mx = -nx; mz = -nz; }
          else { mx = -nz * e.strafeDir; mz = nx * e.strafeDir; }

          if (e.fireCooldown <= 0 && dist < 48) {
            const targetY = EYE_HEIGHT, fromY = e.y;
            const tdx = player.x - e.x, tdy = targetY - fromY, tdz = player.z - e.z;
            const tlen = Math.hypot(tdx, tdy, tdz) || 1;
            const dir = new THREE.Vector3(tdx / tlen, tdy / tlen, tdz / tlen);
            dir.x += (Math.random() - 0.5) * 0.08;
            dir.y += (Math.random() - 0.5) * 0.08;
            dir.z += (Math.random() - 0.5) * 0.08;
            dir.normalize();

            const bx = e.x + nx * (e.r + 0.5), bz = e.z + nz * (e.r + 0.5);
            const mesh = new THREE.Mesh(tracerGeo, enemyTracerMat);
            mesh.position.set(bx, fromY, bz);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
            scene.add(mesh);

            bullets.push({
              x: bx, y: fromY, z: bz,
              vx: dir.x * 28, vy: dir.y * 28, vz: dir.z * 28,
              r: 0.4, damage: 8 + wave, friendly: false, life: 2.5, mesh, is3D: true
            });
            e.fireCooldown = Math.max(0.7, 1.35 - wave * 0.03);
          }
        } else {
          mx = nx; mz = nz;
        }

        moveWithCollision(e, mx * e.speed * dt, mz * e.speed * dt);
        e.mesh.position.set(e.x, e.y, e.z);
        e.mesh.rotation.y = Math.atan2(dx, dz);

        // Обновляем billboard-лицо (позицию и ориентацию на камеру)
        updateFacePlaneTransform(e);

        if (dist < e.r + player.r + 0.3 && player.invuln <= 0) {
          player.hp -= e.damage;
          player.invuln = 0.7;
          moveWithCollision(player, nx * 1.8, nz * 1.8);
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        if (b.is3D) b.y += b.vy * dt;
        b.z += b.vz * dt;
        b.life -= dt;

        if (b.life <= 0 || hitsObstacleOrBounds(b.x, b.z, b.r) || (b.is3D && (b.y < 0.1 || b.y > 20))) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
          continue;
        }

        let removed = false;
        if (b.friendly) {
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const dh = Math.hypot(b.x - e.x, b.z - e.z);
            const dy = Math.abs(b.y - e.y);
            if (dh < b.r + e.r && dy < e.y + 0.8) {
              e.hp -= b.damage;
              scene.remove(b.mesh);
              bullets.splice(i, 1);
              removed = true;
              if (e.hp <= 0) {
                score += e.score;
                scene.remove(e.mesh);
                if (e.facePlane) scene.remove(e.facePlane);
                dropPickup(e.x, e.z);
                enemies.splice(j, 1);
              }
              break;
            }
          }
        } else {
          const dh = Math.hypot(b.x - player.x, b.z - player.z);
          const dy = Math.abs(b.y - EYE_HEIGHT);
          if (dh < b.r + player.r + 0.3 && dy < 1.4 && player.invuln <= 0) {
            player.hp -= b.damage;
            player.invuln = 0.45;
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            removed = true;
          }
        }
        if (!removed) b.mesh.position.set(b.x, b.y, b.z);
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.ttl -= dt;
        if (p.ttl <= 0) { scene.remove(p.mesh); pickups.splice(i, 1); continue; }
        p.mesh.rotation.y += dt * 2;
        p.mesh.position.y = 1.2 + Math.sin(globalTime * 3 + p.phase) * 0.18;

        if (Math.hypot(p.x - player.x, p.z - player.z) < p.r + player.r) {
          if (p.type === "smg") player.weapon = 1;
          else if (p.type === "shotgun") player.weapon = 2;
          else player.hp = Math.min(player.maxHp, player.hp + 25);
          scene.remove(p.mesh);
          pickups.splice(i, 1);
        }
      }

      if (spawnQueue === 0 && enemies.length === 0) {
        betweenWaveTimer -= dt;
        if (betweenWaveTimer <= 0) {
          score += 25 * wave;
          player.hp = Math.min(player.maxHp, player.hp + 12);
          startWave(wave + 1);
        }
      }

      if (player.hp <= 0) {
        player.hp = 0;
        state = "gameover";
        if (document.exitPointerLock) { try { document.exitPointerLock(); } catch (e) {} }
      }
    }

    function updateCamera(dt) {
      weaponRecoil *= Math.pow(0.001, dt);
      if (flashTime > 0) {
        flashTime -= dt;
        if (flashTime <= 0) muzzleFlash.intensity = 0;
      }

      const moving =
        Math.abs(touch.moveVector.x) + Math.abs(touch.moveVector.y) > 0.1 ||
        keys["w"] || keys["a"] || keys["s"] || keys["d"] ||
        keys["arrowup"] || keys["arrowdown"] || keys["arrowleft"] || keys["arrowright"];

      if (moving) weaponBob += dt * 10;
      else weaponBob += dt * 2;

      const bobX = Math.sin(weaponBob * 2) * (moving ? 0.015 : 0.005);
      const bobY = Math.abs(Math.cos(weaponBob * 4)) * (moving ? 0.02 : 0.007);

      camera.position.set(player.x, EYE_HEIGHT, player.z);
      camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

      const fovScale =
        Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5) /
        Math.tan(THREE.MathUtils.degToRad(BASE_FOV) * 0.5);

      weaponGroup.scale.setScalar(fovScale);
      weaponGroup.position.set(
        (WEAPON_POS.x + bobX) * fovScale,
        (WEAPON_POS.y + bobY) * fovScale,
        WEAPON_POS.z + weaponRecoil
      );
      weaponGroup.rotation.x = -weaponRecoil * 2.5;
      weaponGroup.rotation.y = -bobX * 0.5;

      if (player.invuln > 0) {
        const shake = player.invuln * 0.08;
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
      }
    }

    function drawHUD() {
      const pad = 12;
      const fontSize = Math.max(13, Math.min(18, view.cssW / 42));
      const panelW = Math.min(300, view.cssW * 0.55);
      const panelH = fontSize * 4 + 34;

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(pad, pad, panelW, panelH);

      ctx.fillStyle = "#e6e6f0";
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = "left";
      ctx.fillText(`Счёт: ${score}`, pad + 12, pad + fontSize + 8);
      ctx.fillText(`Волна: ${wave}`, pad + 12, pad + fontSize * 2 + 14);
      ctx.fillText(`Оружие: ${weapons[player.weapon].name}`, pad + 12, pad + fontSize * 3 + 20);

      const barX = pad + 12, barY = pad + panelH - 18, barW = panelW - 24, barH = 10;
      const hpRatio = Math.max(0, player.hp / player.maxHp);
      ctx.fillStyle = "#222";
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = hpRatio > 0.35 ? "#58d68d" : "#ff5d5d";
      ctx.fillRect(barX, barY, barW * hpRatio, barH);

      const cx = view.cssW / 2, cy = view.cssH / 2;
      const gap = 6, length = 12, thickness = 2;
      ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
      ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
      ctx.lineWidth = 1;

      ctx.fillRect(cx - thickness/2, cy - gap - length, thickness, length);
      ctx.strokeRect(cx - thickness/2, cy - gap - length, thickness, length);
      ctx.fillRect(cx - thickness/2, cy + gap, thickness, length);
      ctx.strokeRect(cx - thickness/2, cy + gap, thickness, length);
      ctx.fillRect(cx - gap - length, cy - thickness/2, length, thickness);
      ctx.strokeRect(cx - gap - length, cy - thickness/2, length, thickness);
      ctx.fillRect(cx + gap, cy - thickness/2, length, thickness);
      ctx.strokeRect(cx + gap, cy - thickness/2, length, thickness);

      ctx.beginPath();
      ctx.arc(cx, cy, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawJoystick(start, current, radius, color) {
      const vec = stickVector(start, current, radius, 0);
      const knobX = start.x + vec.x * radius, knobY = start.y + vec.y * radius;
      ctx.save();
      ctx.globalAlpha = 0.2; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(start.x, start.y, radius, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.4; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.lineTo(knobX, knobY); ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(knobX, knobY, 28, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawStaticJoystickHint(x, y, radius, color, label) {
      ctx.save();
      ctx.globalAlpha = 0.15; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.25; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.4; ctx.fillStyle = color; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
      ctx.fillText(label, x, y + 4);
      ctx.restore();
    }

    function drawTouchControls() {
      if (state !== "playing" || !isTouchDevice) return;

      if (touch.moveId === null) {
        drawStaticJoystickHint(view.cssW * 0.2, view.cssH * 0.75, 50, "rgba(255,255,255,0.4)", "ДВИЖЕНИЕ");
      } else {
        drawJoystick(touch.moveStart, touch.moveCurrent, MOVE_RADIUS, "rgba(255, 255, 255, 0.6)");
      }

      if (touch.lookId === null) {
         ctx.save();
         ctx.globalAlpha = 0.15;
         ctx.fillStyle = "#ffffff";
         ctx.font = "bold 13px Arial";
         ctx.textAlign = "center";
         ctx.fillText("ПРОВОДИТЕ ЗДЕСЬ ДЛЯ ОБЗОРА", view.cssW * 0.75, view.cssH * 0.5);
         ctx.restore();
      }
    }

    function drawMenu() {
      ctx.fillStyle = "rgba(0,0,0,0.58)";
      ctx.fillRect(0, 0, view.cssW, view.cssH);
      ctx.textAlign = "center";
      const titleSize = Math.max(28, Math.min(64, view.cssW / 12));
      const textSize = Math.max(14, Math.min(22, view.cssW / 36));
      ctx.fillStyle = "#fff"; ctx.font = `bold ${titleSize}px Arial`;
      ctx.fillText("MASKED MERC FPS 3D", view.cssW / 2, view.cssH * 0.26);
      ctx.font = `${textSize}px Arial`;
      const lines = isTouchDevice
        ? ["Левая часть экрана — движение (джойстик)", "Правая часть экрана — поворот камеры", "Кнопка ОГОНЬ справа внизу — стрельба"]
        : ["WASD — движение", "Мышь — обзор (кликните для захвата курсора)", "ЛКМ — стрельба, ESC — освободить курсор"];
      lines.forEach((line, i) => ctx.fillText(line, view.cssW / 2, view.cssH * 0.46 + textSize * 1.8 * i));
      ctx.fillStyle = "#ffd76a";
      ctx.fillText("Коснись или кликни, чтобы начать", view.cssW / 2, view.cssH * 0.82);
      ctx.textAlign = "left";
    }

    function drawGameOver() {
      ctx.fillStyle = "rgba(0,0,0,0.66)";
      ctx.fillRect(0, 0, view.cssW, view.cssH);
      ctx.textAlign = "center";
      const titleSize = Math.max(28, Math.min(64, view.cssW / 12));
      const textSize = Math.max(16, Math.min(28, view.cssW / 28));
      ctx.fillStyle = "#fff"; ctx.font = `bold ${titleSize}px Arial`;
      ctx.fillText("ИГРА ОКОНЧЕНА", view.cssW / 2, view.cssH * 0.35);
      ctx.font = `${textSize}px Arial`;
      ctx.fillText(`Счёт: ${score}`, view.cssW / 2, view.cssH * 0.5);
      ctx.fillText(`Волна: ${wave}`, view.cssW / 2, view.cssH * 0.5 + textSize * 1.7);
      ctx.fillStyle = "#ffd76a";
      ctx.fillText("Коснись или кликни, чтобы начать заново", view.cssW / 2, view.cssH * 0.78);
      ctx.textAlign = "left";
    }

    function drawRotateHint() {
      if (isTouchDevice && view.cssH > view.cssW) {
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, view.cssW, view.cssH);
        ctx.fillStyle = "#fff"; ctx.font = "bold 26px Arial"; ctx.textAlign = "center";
        ctx.fillText("Поверни устройство горизонтально", view.cssW / 2, view.cssH / 2);
        ctx.textAlign = "left";
      }
    }

    function drawUI() {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.clearRect(0, 0, view.cssW, view.cssH);
      if (state === "playing") { drawHUD(); drawTouchControls(); }
      if (state === "menu") drawMenu();
      if (state === "gameover") drawGameOver();
      drawRotateHint();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.035);
      last = now;
      globalTime += dt;
      update(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
      drawUI();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function isFullscreen() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }

    async function toggleFullscreen() {
      const doc = document, elem = document.documentElement;
      try {
        if (!isFullscreen()) {
          if (elem.requestFullscreen) await elem.requestFullscreen({ navigationUI: "hide" });
          else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            try { await screen.orientation.lock("landscape"); } catch (e) {}
          }
        } else {
          if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          if (doc.exitFullscreen) await doc.exitFullscreen();
          else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
        }
      } catch (err) { console.warn("Fullscreen error:", err); }
      setTimeout(resize, 150);
    }

    function updateFullscreenButton() {
      fullscreenBtn.textContent = isFullscreen() ? "✕ Выйти" : "⛶ Полный экран";
    }

    fullscreenBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); });
    document.addEventListener("fullscreenchange", () => { updateFullscreenButton(); setTimeout(resize, 100); });
    document.addEventListener("webkitfullscreenchange", () => { updateFullscreenButton(); setTimeout(resize, 100); });

    sceneCanvas.addEventListener("click", (e) => {
      if (state !== "playing") { startGame(); return; }
      if (!isTouchDevice && !pointerLocked && sceneCanvas.requestPointerLock) {
        try { sceneCanvas.requestPointerLock(); } catch (err) {}
      }
    });

    document.addEventListener("pointerlockchange", () => {
      pointerLocked = document.pointerLockElement === sceneCanvas;
    });

    sceneCanvas.addEventListener("mousemove", (e) => {
      if (!pointerLocked) return;
      mouseLookAccum.x += e.movementX || 0;
      mouseLookAccum.y += e.movementY || 0;
    });

    sceneCanvas.addEventListener("mousedown", (e) => {
      if (e.button === 0) {
        mouseDown = true;
        if (state !== "playing") startGame();
      }
    });

    window.addEventListener("mouseup", (e) => { if (e.button === 0) mouseDown = false; });

    fireBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); 
      e.stopPropagation();
      touch.fireBtnDown = true;
      if (state !== "playing") startGame();
    }, { passive: false });

    fireBtn.addEventListener("pointerup", (e) => {
      e.preventDefault(); 
      e.stopPropagation(); 
      touch.fireBtnDown = false;
    }, { passive: false });

    fireBtn.addEventListener("pointercancel", () => { touch.fireBtnDown = false; });

    sceneCanvas.addEventListener("pointerdown", (e) => {
      if (!isTouchDevice) return;
      e.preventDefault();

      if (state !== "playing") { startGame(); return; }

      const isLeftSide = e.clientX < view.cssW * 0.6;

      if (isLeftSide && touch.moveId === null) {
        touch.moveId = e.pointerId;
        touch.moveStart = { x: e.clientX, y: e.clientY };
        touch.moveCurrent = { x: e.clientX, y: e.clientY };
      } else if (!isLeftSide && touch.lookId === null) {
        touch.lookId = e.pointerId;
        touch.lookLast = { x: e.clientX, y: e.clientY };
      }
      updateTouchVectors();
    }, { passive: false });

    sceneCanvas.addEventListener("pointermove", (e) => {
      if (!isTouchDevice) return;
      e.preventDefault(); 

      if (e.pointerId === touch.moveId) {
        touch.moveCurrent = { x: e.clientX, y: e.clientY };
        updateTouchVectors();
      }

      if (e.pointerId === touch.lookId) {
        const dx = e.clientX - touch.lookLast.x;
        const dy = e.clientY - touch.lookLast.y;

        player.yaw -= dx * LOOK_SENS_TOUCH;
        player.pitch -= dy * LOOK_SENS_TOUCH;
        clampPitch();

        touch.lookLast = { x: e.clientX, y: e.clientY };
      }
    }, { passive: false });

    function releasePointer(e) {
      if (e.pointerId === touch.moveId) {
        touch.moveId = null;
        touch.moveVector = { x: 0, y: 0 };
      }
      if (e.pointerId === touch.lookId) {
        touch.lookId = null;
      }
    }

    sceneCanvas.addEventListener("pointerup", releasePointer);
    sceneCanvas.addEventListener("pointercancel", releasePointer);

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) e.preventDefault();
      if (state !== "playing" && (key === "enter" || key === " ")) startGame();
    });

    window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
    sceneCanvas.addEventListener("contextmenu", (e) => e.preventDefault());

    updateFullscreenButton();
  </script>
</body>
  </html>
