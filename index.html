    function drawUI() {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.clearRect(0, 0, view.cssW, view.cssH);
      if (state === "playing") { drawHUD(); drawTouchControls(); }
      if (state === "menu") { rebuildMenuButtons(); drawMenu(); }
      if (state === "gameover") drawGameOver();
      if (state === "paused") drawPause();
      if (state === "host-waiting") drawHostWaiting();
      if (state === "connecting") drawConnecting();
      drawRotateHint();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.035);
      last = now;
      globalTime += dt;
      update(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
      drawUI();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ============================================================
    //  МУЛЬТИПЛЕЕР — запуск
    // ============================================================
    function genCode() {
      const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      let s = '';
      for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    function startHosting() {
      roomCode = genCode();
      myRole = 'host';
      state = 'host-waiting';
      initPeer(() => {
        // peer ID уже задан как ROOM_PREFIX + code
      });
      // Оверрайдим: создаём peer с фиксированным ID
      try { peer.destroy(); } catch (e) {}
      peer = new Peer(ROOM_PREFIX + roomCode);
      peer.on('open', (id) => {
        console.log('[Peer] Хост открыт с ID:', id, 'код:', roomCode);
      });
      peer.on('connection', (c) => {
        console.log('[Peer] Клиент подключился');
        setupConnection(c);
      });
      peer.on('error', (err) => {
        console.error('[Peer] host error:', err);
        alert('Ошибка: ' + err.type);
        state = 'menu';
      });
    }

    function startJoining() {
      myRole = 'client';
      state = 'connecting';
      // Показываем окно ввода кода
      roomInput.style.display = 'block';
      roomInput.value = '';
      roomInput.focus();
    }

    function submitJoinCode() {
      const code = roomInput.value.trim().toUpperCase();
      roomInput.style.display = 'none';
      if (code.length < 4) {
        state = 'menu';
        return;
      }
      roomCode = code;
      state = 'connecting';
      initPeer();
      peer.on('open', () => {
        console.log('[Peer] Пытаюсь подключиться к', ROOM_PREFIX + code);
        const c = peer.connect(ROOM_PREFIX + code, { reliable: true });
        setupConnection(c);
      });
    }

    function isFullscreen() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }

    async function toggleFullscreen() {
      const doc = document, elem = document.documentElement;
      try {
        if (!isFullscreen()) {
          if (elem.requestFullscreen) await elem.requestFullscreen({ navigationUI: "hide" });
          else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            try { await screen.orientation.lock("landscape"); } catch (e) {}
          }
        } else {
          if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          if (doc.exitFullscreen) await doc.exitFullscreen();
          else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
        }
      } catch (err) { console.warn("Fullscreen error:", err); }
      setTimeout(resize, 150);
    }

    function updateFullscreenButton() {
      fullscreenBtn.textContent = isFullscreen() ? "✕ Выйти" : "⛶ Полный экран";
    }

    function updatePauseButton() {
      pauseBtn.textContent = state === "paused" ? "▶" : "⏸";
      pauseBtn.style.display = (state === "playing" || state === "paused") ? "" : "none";
    }

    function togglePause() {
      if (state === "playing") {
        state = "paused";
        mouseDown = false; isAiming = false;
        touch.fireBtnDown = false;
        touch.moveId = null; touch.lookId = null;
        touch.moveVector = { x: 0, y: 0 };
        for (const k in keys) keys[k] = false;
        if (document.exitPointerLock) { try { document.exitPointerLock(); } catch (e) {} }
      } else if (state === "paused") {
        state = "playing";
        last = performance.now();
        if (!isTouchDevice && sceneCanvas.requestPointerLock) {
          try { sceneCanvas.requestPointerLock(); } catch (e) {}
        }
      }
      updatePauseButton();
    }

    fullscreenBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); });
    pauseBtn.addEventListener("click", (e) => { e.stopPropagation(); togglePause(); });
    document.addEventListener("fullscreenchange", () => { updateFullscreenButton(); setTimeout(resize, 100); });
    document.addEventListener("webkitfullscreenchange", () => { updateFullscreenButton(); setTimeout(resize, 100); });

    // Клик по канвасу — начало игры / меню кнопок
    sceneCanvas.addEventListener("click", (e) => {
      if (state === "paused") { togglePause(); return; }
      if (state === "menu") {
        // Проверяем попадание в кнопки
        const mx = e.clientX, my = e.clientY;
        for (const b of menuButtons) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            if (b.action === 'single') startSingleGame();
            else if (b.action === 'host') startHosting();
            else if (b.action === 'join') startJoining();
            return;
          }
        }
        return;
      }
      if (state === "gameover") { state = "menu"; return; }
      if (state === "host-waiting") {
        // Отмена
        try { peer.destroy(); } catch (err) {}
        peer = null;
        state = "menu";
        return;
      }
      if (state !== "playing") return;
      if (!isTouchDevice && !pointerLocked && sceneCanvas.requestPointerLock) {
        try { sceneCanvas.requestPointerLock(); } catch (err) {}
      }
    });

    // Мобильный клик по меню
    sceneCanvas.addEventListener("pointerdown", (e) => {
      if (!isTouchDevice) return;
      if (state === "menu") {
        e.preventDefault();
        const mx = e.clientX, my = e.clientY;
        for (const b of menuButtons) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            if (b.action === 'single') startSingleGame();
            else if (b.action === 'host') startHosting();
            else if (b.action === 'join') startJoining();
            return;
          }
        }
        return;
      }
      if (state === "paused") { togglePause(); return; }
      if (state !== "playing") return;
      const isLeftSide = e.clientX < view.cssW * 0.6;
      if (isLeftSide && touch.moveId === null) {
        touch.moveId = e.pointerId;
        touch.moveStart = { x: e.clientX, y: e.clientY };
        touch.moveCurrent = { x: e.clientX, y: e.clientY };
      } else if (!isLeftSide && touch.lookId === null) {
        touch.lookId = e.pointerId;
        touch.lookLast = { x: e.clientX, y: e.clientY };
      }
      updateTouchVectors();
    }, { passive: false });

    document.addEventListener("pointerlockchange", () => {
      const wasLocked = pointerLocked;
      pointerLocked = document.pointerLockElement === sceneCanvas;
      if (!isTouchDevice && wasLocked && !pointerLocked && state === "playing") togglePause();
    });

    sceneCanvas.addEventListener("mousemove", (e) => {
      if (!pointerLocked) return;
      mouseLookAccum.x += e.movementX || 0;
      mouseLookAccum.y += e.movementY || 0;
    });

    sceneCanvas.addEventListener("mousedown", (e) => {
      if (e.button === 0) {
        mouseDown = true;
      }
      if (e.button === 2) {
        isAiming = true;
      }
    });

    window.addEventListener("mouseup", (e) => {
      if (e.button === 0) mouseDown = false;
      if (e.button === 2) isAiming = false;
    });

    sceneCanvas.addEventListener("contextmenu", (e) => e.preventDefault());
    window.addEventListener("blur", () => { isAiming = false; mouseDown = false; });

    fireBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); e.stopPropagation();
      touch.fireBtnDown = true;
    }, { passive: false });

    fireBtn.addEventListener("pointerup", (e) => {
      e.preventDefault(); e.stopPropagation();
      touch.fireBtnDown = false;
    }, { passive: false });

    fireBtn.addEventListener("pointercancel", () => { touch.fireBtnDown = false; });

    jumpBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); e.stopPropagation();
      tryJump();
    }, { passive: false });

    sceneCanvas.addEventListener("pointermove", (e) => {
      if (!isTouchDevice) return;
      e.preventDefault();
      if (e.pointerId === touch.moveId) {
        touch.moveCurrent = { x: e.clientX, y: e.clientY };
        updateTouchVectors();
      }
      if (e.pointerId === touch.lookId) {
        const dx = e.clientX - touch.lookLast.x;
        const dy = e.clientY - touch.lookLast.y;
        player.yaw -= dx * LOOK_SENS_TOUCH;
        player.pitch -= dy * LOOK_SENS_TOUCH;
        clampPitch();
        touch.lookLast = { x: e.clientX, y: e.clientY };
      }
    }, { passive: false });

    function releasePointer(e) {
      if (e.pointerId === touch.moveId) {
        touch.moveId = null;
        touch.moveVector = { x: 0, y: 0 };
      }
      if (e.pointerId === touch.lookId) touch.lookId = null;
    }

    sceneCanvas.addEventListener("pointerup", releasePointer);
    sceneCanvas.addEventListener("pointercancel", releasePointer);

    // Ввод кода комнаты
    roomInput.addEventListener("keydown", (e) => {
      if (e.key === 'Enter') submitJoinCode();
      if (e.key === 'Escape') { roomInput.style.display = 'none'; state = 'menu'; }
    });

    window.addEventListener("keydown", (e) => {
      // Если открыто поле ввода — не обрабатываем игровые клавиши
      if (document.activeElement === roomInput) return;
      const key = e.key.toLowerCase();
      keys[key] = true;
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) e.preventDefault();
      if (key === " ") {
        if (state === "playing") tryJump();
        else if (state === "paused") togglePause();
      }
      if (key === "escape") {
        if (state === "playing") togglePause();
        else if (state === "paused") togglePause();
        else if (state === "host-waiting") {
          try { peer.destroy(); } catch (err) {}
          peer = null;
          state = "menu";
        }
      }
    });

    window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

    updateFullscreenButton();
    updatePauseButton();
  </script>
</body>
  </html>
